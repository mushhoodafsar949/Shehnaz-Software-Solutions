<div class="quote-dialog-header">
  <h2 class="dialog-title">
    <i class="pi pi-file-text title-icon"></i>
    Request a Quote
  </h2>
  <p class="dialog-subtitle">Tell us about your project and we'll provide a detailed estimate</p>
</div>

<form [formGroup]="quoteForm" (ngSubmit)="onSubmit()" class="quote-form">
  <div class="form-grid">
    <div class="form-field">
      <span class="p-float-label">
        <input pInputText 
               id="name" 
               formControlName="name" 
               class="w-full" />
        <label for="name">Full Name *</label>
      </span>
    </div>

    <div class="form-field">
      <span class="p-float-label">
        <input pInputText 
               id="email" 
               formControlName="email" 
               type="email" 
               class="w-full" />
        <label for="email">Email Address *</label>
      </span>
    </div>

    <div class="form-field">
      <span class="p-float-label">
        <input pInputText 
               id="company" 
               formControlName="company" 
               class="w-full" />
        <label for="company">Company Name</label>
      </span>
    </div>

    <div class="form-field">
      <span class="p-float-label">
        <input pInputText 
               id="phone" 
               formControlName="phone" 
               type="tel" 
               class="w-full" />
        <label for="phone">Phone Number</label>
      </span>
    </div>
  </div>

  <div class="form-field">
    <label for="service" class="field-label">Service Interest *</label>
    <p-selectButton id="service" 
                    [options]="services" 
                    formControlName="service"
                    optionLabel="name" 
                    optionValue="code"
                    [multiple]="false"
                    class="w-full service-selector">
    </p-selectButton>
  </div>

  <div class="form-field">
    <label for="budget" class="field-label">Budget Range *</label>
    <p-selectButton id="budget" 
                    [options]="budgetRanges" 
                    formControlName="budget"
                    optionLabel="name" 
                    optionValue="value"
                    [multiple]="false"
                    class="w-full budget-selector">
    </p-selectButton>
  </div>

  <div class="form-field">
    <label for="timeline" class="field-label">Project Timeline</label>
    <p-selectButton id="timeline" 
                    [options]="timelineOptions" 
                    formControlName="timeline"
                    optionLabel="name" 
                    optionValue="value"
                    [multiple]="false"
                    class="w-full timeline-selector">
    </p-selectButton>
  </div>

  <div class="form-field">
    <span class="p-float-label">
      <textarea pInputTextarea 
                id="requirements" 
                formControlName="requirements"
                [rows]="5" 
                [autoResize]="true"
                class="w-full"
                placeholder="Describe your project requirements, goals, and any specific features you need...">
      </textarea>
      <label for="requirements">Project Requirements *</label>
    </span>
  </div>

  <div class="additional-services">
    <label class="field-label">Additional Services (Optional)</label>
    <div class="services-grid">
      <div *ngFor="let service of additionalServices" 
           class="service-option"
           (click)="toggleAdditionalService(service)"
           [class.selected]="service.selected">
        <i [class]="service.icon" class="service-icon"></i>
        <div class="service-info">
          <h4>{{ service.name }}</h4>
          <p>{{ service.description }}</p>
        </div>
        <p-checkbox [binary]="true" 
                    [(ngModel)]="service.selected" 
                    [ngModelOptions]="{standalone: true}">
        </p-checkbox>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button pButton pRipple 
            type="button" 
            label="Cancel" 
            icon="pi pi-times"
            class="p-button-outlined p-button-secondary"
            (click)="onCancel()">
    </button>
    <button pButton pRipple 
            type="submit" 
            label="Send Quote Request" 
            icon="pi pi-send"
            class="p-button-primary"
            [loading]="isSubmitting"
            [disabled]="!quoteForm.valid || isSubmitting">
    </button>
  </div>
</form>
