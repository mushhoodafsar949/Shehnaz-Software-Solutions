<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64b5f6;stop-opacity:1" />
    </linearGradient>
    <filter id="webGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="48" fill="url(#webGradient)" filter="url(#webGlow)" opacity="0.95"/>
  
  <!-- Browser window -->
  <g transform="translate(50, 50)">
    <!-- Browser frame -->
    <rect x="-30" y="-25" width="60" height="45" rx="6" fill="#ffffff" opacity="0.95"/>
    
    <!-- Browser header -->
    <rect x="-30" y="-25" width="60" height="8" rx="6" fill="#e8eaf6"/>
    <circle cx="-23" cy="-21" r="1.5" fill="#f44336"/>
    <circle cx="-18" cy="-21" r="1.5" fill="#ff9800"/>
    <circle cx="-13" cy="-21" r="1.5" fill="#4caf50"/>
    
    <!-- Code brackets -->
    <text x="-20" y="-5" font-family="Monaco, monospace" font-size="14" font-weight="bold" fill="url(#webGradient)">&lt;</text>
    <text x="15" y="-5" font-family="Monaco, monospace" font-size="14" font-weight="bold" fill="url(#webGradient)">/&gt;</text>
    
    <!-- HTML structure -->
    <rect x="-15" y="0" width="30" height="2" rx="1" fill="#e8eaf6"/>
    <rect x="-10" y="5" width="20" height="2" rx="1" fill="#e8eaf6"/>
    <rect x="-8" y="10" width="16" height="2" rx="1" fill="#e8eaf6"/>
    
    <!-- Responsive indicators -->
    <g transform="translate(-35, 15)">
      <!-- Mobile -->
      <rect x="0" y="0" width="6" height="10" rx="2" fill="#ffffff" stroke="url(#webGradient)" stroke-width="1"/>
      <rect x="1" y="1" width="4" height="6" fill="#e8eaf6"/>
    </g>
    
    <g transform="translate(29, 15)">
      <!-- Desktop -->
      <rect x="0" y="0" width="12" height="8" rx="1" fill="#ffffff" stroke="url(#webGradient)" stroke-width="1"/>
      <rect x="1" y="1" width="10" height="5" fill="#e8eaf6"/>
      <rect x="4" y="8" width="4" height="1" fill="url(#webGradient)"/>
      <rect x="3" y="9" width="6" height="1" fill="url(#webGradient)"/>
    </g>
    
    <!-- JavaScript elements -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="url(#webGradient)">JS</text>
      <circle cx="-12" cy="-2" r="2" fill="#ffc107" opacity="0.8"/>
      <circle cx="12" cy="-2" r="2" fill="#4caf50" opacity="0.8"/>
      <line x1="-12" y1="-2" x2="0" y2="-2" stroke="url(#webGradient)" stroke-width="1"/>
      <line x1="12" y1="-2" x2="0" y2="-2" stroke="url(#webGradient)" stroke-width="1"/>
    </g>
    
    <!-- CSS styling indicator -->
    <g transform="translate(-25, -35)" opacity="0.8">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#e91e63"/>
      <text x="4" y="6" text-anchor="middle" font-family="Arial" font-size="4" fill="#ffffff">CSS</text>
    </g>
    
    <!-- HTML indicator -->
    <g transform="translate(17, -35)" opacity="0.8">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#ff5722"/>
      <text x="4" y="6" text-anchor="middle" font-family="Arial" font-size="3.5" fill="#ffffff">HTML</text>
    </g>
  </g>
</svg>

