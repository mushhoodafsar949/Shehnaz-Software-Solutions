<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f44336;stop-opacity:1" />
    </linearGradient>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="48" fill="url(#aiGradient)" filter="url(#aiGlow)" opacity="0.95"/>
  
  <g transform="translate(50, 50)">
    <!-- Brain/Neural network center -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" opacity="0.95"/>
    
    <!-- Central AI core -->
    <circle cx="0" cy="0" r="6" fill="url(#aiGradient)" opacity="0.8"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial" font-size="5" font-weight="bold" fill="#ffffff">AI</text>
    
    <!-- Neural network nodes -->
    <circle cx="-25" cy="-15" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="25" cy="-15" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="-25" cy="15" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="25" cy="15" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="-30" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="30" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="-35" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="35" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
    
    <!-- Neural connections -->
    <line x1="-25" y1="-15" x2="0" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="25" y1="-15" x2="0" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="-25" y1="15" x2="0" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="25" y1="15" x2="0" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="-30" x2="0" y2="-12" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="30" x2="0" y2="12" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="-35" y1="0" x2="-12" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="35" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    
    <!-- ML/AI technology indicators -->
    <g transform="translate(-25, -30)" opacity="0.8">
      <rect x="-4" y="-3" width="8" height="6" rx="2" fill="#4caf50"/>
      <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">TF</text>
    </g>
    
    <g transform="translate(25, -30)" opacity="0.8">
      <rect x="-4" y="-3" width="8" height="6" rx="2" fill="#ff6f00"/>
      <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">PyTorch</text>
    </g>
    
    <!-- Data processing indicators -->
    <g transform="translate(-40, -10)" opacity="0.8">
      <rect x="0" y="0" width="6" height="4" rx="1" fill="#2196f3"/>
      <text x="3" y="2.5" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Data</text>
    </g>
    
    <g transform="translate(34, -10)" opacity="0.8">
      <rect x="0" y="0" width="8" height="4" rx="1" fill="#ff5722"/>
      <text x="4" y="2.5" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Model</text>
    </g>
    
    <!-- Deep learning layers -->
    <g transform="translate(-40, 10)" opacity="0.8">
      <rect x="0" y="0" width="6" height="2" fill="#ffffff" opacity="0.7"/>
      <rect x="0" y="3" width="6" height="2" fill="#ffffff" opacity="0.7"/>
      <rect x="0" y="6" width="6" height="2" fill="#ffffff" opacity="0.7"/>
      <text x="3" y="12" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#ffffff">Layers</text>
    </g>
    
    <g transform="translate(34, 10)" opacity="0.8">
      <circle cx="4" cy="4" r="4" fill="#9c27b0"/>
      <text x="4" y="5.5" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">CNN</text>
    </g>
    
    <!-- Prediction/Output -->
    <g transform="translate(0, 38)" opacity="0.9">
      <rect x="-8" y="0" width="16" height="4" rx="2" fill="#ffffff"/>
      <text x="0" y="2.5" text-anchor="middle" font-family="Arial" font-size="2.5" fill="url(#aiGradient)">Predictions</text>
    </g>
    
    <!-- Data flow arrows -->
    <g opacity="0.6">
      <path d="M -30,0 L -15,0" stroke="#ffffff" stroke-width="1.5" marker-end="url(#aiArrow)"/>
      <path d="M 15,0 L 30,0" stroke="#ffffff" stroke-width="1.5" marker-end="url(#aiArrow)"/>
      <path d="M 0,15 L 0,25" stroke="#ffffff" stroke-width="1.5" marker-end="url(#aiArrow)"/>
    </g>
    
    <!-- Algorithm complexity indicator -->
    <g transform="translate(0, -45)" opacity="0.7">
      <path d="M -8,0 Q -4,-4 0,0 Q 4,-4 8,0" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Algorithm</text>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="aiArrow" markerWidth="4" markerHeight="3" refX="4" refY="1.5" orient="auto">
      <polygon points="0 0, 4 1.5, 0 3" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

