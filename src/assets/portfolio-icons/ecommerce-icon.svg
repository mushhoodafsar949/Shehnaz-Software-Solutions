<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ecommerceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8a65;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc107;stop-opacity:1" />
    </linearGradient>
    <filter id="ecommerceGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="40" cy="40" r="38" fill="url(#ecommerceGradient)" filter="url(#ecommerceGlow)" opacity="0.9"/>
  
  <!-- Shopping cart and digital elements -->
  <g transform="translate(40, 40)">
    <!-- Shopping cart -->
    <g transform="translate(-5, -5)">
      <!-- Cart body -->
      <path d="M -8,-10 L -6,-10 L -4,5 L 12,5 L 14,-5 L 0,-5" 
            stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round"/>
      
      <!-- Cart handle -->
      <path d="M -8,-10 L -12,-10 L -12,-8" 
            stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      
      <!-- Cart wheels -->
      <circle cx="-2" cy="10" r="2" fill="#ffffff"/>
      <circle cx="8" cy="10" r="2" fill="#ffffff"/>
    </g>
    
    <!-- Digital connection nodes -->
    <circle cx="-25" cy="-12" r="2" fill="#ffffff"/>
    <circle cx="25" cy="-12" r="2" fill="#ffffff"/>
    <circle cx="-25" cy="12" r="2" fill="#ffffff"/>
    <circle cx="25" cy="12" r="2" fill="#ffffff"/>
    
    <!-- Connection lines representing online network -->
    <line x1="-25" y1="-12" x2="-8" y2="-5" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="25" y1="-12" x2="12" y2="-5" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="-25" y1="12" x2="-8" y2="5" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="25" y1="12" x2="12" y2="5" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    
    <!-- Mobile phone icons -->
    <g transform="translate(-25, -25)" opacity="0.8">
      <rect x="-3" y="-6" width="6" height="12" rx="2" fill="#ffffff"/>
      <rect x="-2" y="-4" width="4" height="6" fill="url(#ecommerceGradient)"/>
      <circle cx="0" cy="4" r="1" fill="#ffffff"/>
    </g>
    
    <g transform="translate(25, -25)" opacity="0.8">
      <rect x="-3" y="-6" width="6" height="12" rx="2" fill="#ffffff"/>
      <rect x="-2" y="-4" width="4" height="6" fill="url(#ecommerceGradient)"/>
      <circle cx="0" cy="4" r="1" fill="#ffffff"/>
    </g>
    
    <!-- Package/delivery box -->
    <g transform="translate(0, 20)" opacity="0.9">
      <rect x="-6" y="-3" width="12" height="6" fill="#ffffff" rx="1"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="url(#ecommerceGradient)" stroke-width="1"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="url(#ecommerceGradient)" stroke-width="1"/>
    </g>
    
    <!-- AI recommendation stars -->
    <g transform="translate(15, -20)" opacity="0.7">
      <polygon points="0,-3 1,-1 3,-1 1,0 2,2 0,1 -2,2 -1,0 -3,-1 -1,-1" fill="#ffffff"/>
    </g>
    <g transform="translate(-15, -20)" opacity="0.7">
      <polygon points="0,-3 1,-1 3,-1 1,0 2,2 0,1 -2,2 -1,0 -3,-1 -1,-1" fill="#ffffff"/>
    </g>
  </g>
</svg>
