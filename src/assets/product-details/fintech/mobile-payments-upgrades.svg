<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700">
  <defs>
    <linearGradient id="gradientPayments" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3949ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Phone Frame -->
  <rect width="400" height="700" fill="#1a1a1a" rx="40"/>
  <rect x="20" y="40" width="360" height="620" fill="#ffffff" rx="30"/>
  
  <!-- Status Bar -->
  <rect x="20" y="40" width="360" height="30" fill="#3949ab"/>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">9:41 AM</text>
  
  <!-- Header -->
  <rect x="20" y="70" width="360" height="60" fill="#3949ab"/>
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Payments &amp; Account</text>
  
  <!-- Account Tier Card -->
  <rect x="40" y="150" width="320" height="100" fill="url(#gradientPayments)" rx="12"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">Current Account Tier</text>
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ff9800" text-anchor="middle">ULTRA</text>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Upgrade Benefits: Higher Limits</text>
  
  <!-- Account Tiers -->
  <text x="40" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e">Account Tiers</text>
  
  <!-- Tier L1 -->
  <rect x="40" y="310" width="320" height="50" fill="#f8f9fa" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="50" y="320" width="30" height="30" fill="#9e9e9e" rx="4"/>
  <text x="65" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">L1</text>
  <text x="90" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a237e">Basic</text>
  <text x="90" y="350" font-family="Arial, sans-serif" font-size="11" fill="#666">Standard limits</text>
  
  <!-- Tier L2 -->
  <rect x="40" y="370" width="320" height="50" fill="#e3f2fd" rx="8" stroke="#3949ab" stroke-width="2"/>
  <rect x="50" y="380" width="30" height="30" fill="#3949ab" rx="4"/>
  <text x="65" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">L2</text>
  <text x="90" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a237e">Premium</text>
  <text x="90" y="410" font-family="Arial, sans-serif" font-size="11" fill="#666">Enhanced features</text>
  
  <!-- Tier Ultra -->
  <rect x="40" y="430" width="320" height="50" fill="#fff3e0" rx="8" stroke="#ff9800" stroke-width="2"/>
  <rect x="50" y="440" width="30" height="30" fill="#ff9800" rx="4"/>
  <text x="65" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">U</text>
  <text x="90" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a237e">Ultra</text>
  <text x="90" y="470" font-family="Arial, sans-serif" font-size="11" fill="#666">Maximum benefits</text>
  
  <!-- Payments Section -->
  <text x="40" y="520" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e">Quick Payments</text>
  
  <!-- IBFT -->
  <rect x="40" y="540" width="150" height="80" fill="#f8f9fa" rx="8"/>
  <circle cx="115" cy="570" r="20" fill="#3949ab"/>
  <text x="115" y="576" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">IBFT</text>
  <text x="115" y="605" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e" text-anchor="middle">Inter-Bank</text>
  
  <!-- International -->
  <rect x="210" y="540" width="150" height="80" fill="#f8f9fa" rx="8"/>
  <circle cx="285" cy="570" r="20" fill="#4caf50"/>
  <text x="285" y="576" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">INT</text>
  <text x="285" y="605" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e" text-anchor="middle">International</text>
  
  <!-- Advance Salary -->
  <rect x="40" y="630" width="320" height="60" fill="#e8f5e9" rx="8"/>
  <circle cx="80" cy="660" r="20" fill="#4caf50"/>
  <text x="80" y="666" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  <text x="110" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e">Advance Salary</text>
  <text x="110" y="670" font-family="Arial, sans-serif" font-size="12" fill="#666">Get salary in advance</text>
  <text x="340" y="660" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50" text-anchor="end">→</text>
</svg>

