<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="agileGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agileGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agileGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agileGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#f8f9fa" rx="20"/>
  
  <!-- Title -->
  <text x="50" y="50" fill="#1e293b" font-family="Arial" font-size="24" font-weight="bold">FinTech Suite - Agile Development Process</text>
  
  <!-- Sprint Planning -->
  <g transform="translate(50, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Sprint Planning</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Risk Assessment -->
      <rect width="200" height="60" fill="url(#agileGrad1)" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Risk Assessment</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Security &amp; Compliance</text>
      
      <!-- Feature Prioritization -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="url(#agileGrad1)" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Feature Prioritization</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Web Portal &amp; Mobile App</text>
      </g>
      
      <!-- Capacity Planning -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="url(#agileGrad1)" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Capacity Planning</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Team Velocity Analysis</text>
      </g>
    </g>
  </g>
  
  <!-- Daily Process -->
  <g transform="translate(350, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Daily Process</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Daily Standups -->
      <rect width="200" height="60" fill="url(#agileGrad2)" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Daily Standups</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Progress &amp; Blockers</text>
      
      <!-- Security Review -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="url(#agileGrad2)" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Security Review</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Threat Assessment</text>
      </g>
      
      <!-- Performance Check -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="url(#agileGrad2)" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Performance Check</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">System Metrics</text>
      </g>
    </g>
  </g>
  
  <!-- Development -->
  <g transform="translate(650, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Development</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Web Portal Development -->
      <rect width="200" height="60" fill="url(#agileGrad3)" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Web Portal</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Angular Development</text>
      
      <!-- Mobile App Development -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="url(#agileGrad3)" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Mobile App</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Flutter Development</text>
      </g>
      
      <!-- API Development -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="url(#agileGrad3)" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Backend APIs</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Node.js &amp; Python</text>
      </g>
    </g>
  </g>
  
  <!-- Review -->
  <g transform="translate(950, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Review</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Security Audit -->
      <rect width="200" height="60" fill="url(#agileGrad4)" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Security Audit</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Penetration Testing</text>
      
      <!-- Performance Review -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="url(#agileGrad4)" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Performance Review</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Load Testing</text>
      </g>
      
      <!-- Compliance Check -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="url(#agileGrad4)" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle" font-weight="600">Compliance Check</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">PCI DSS &amp; SOC 2</text>
      </g>
    </g>
  </g>
  
  <!-- Retrospective -->
  <g transform="translate(50, 450)">
    <rect width="1150" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="575" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Sprint Retrospective</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Financial Performance -->
      <rect width="250" height="200" fill="url(#agileGrad1)" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
      <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle" font-weight="600">Financial Performance</text>
      <g transform="translate(20, 60)">
        <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">- Transaction Success Rate</text>
        <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">- Payment Processing Time</text>
        <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">- System Uptime</text>
      </g>
      
      <!-- Security Metrics -->
      <g transform="translate(300, 0)">
        <rect width="250" height="200" fill="url(#agileGrad3)" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle" font-weight="600">Security Metrics</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">- Attack Prevention</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">- Vulnerability Fixes</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">- Audit Results</text>
        </g>
      </g>
      
      <!-- User Feedback -->
      <g transform="translate(600, 0)">
        <rect width="250" height="200" fill="url(#agileGrad2)" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle" font-weight="600">User Feedback</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">- Mobile App Experience</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">- Web Portal Features</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">- UI/UX Feedback</text>
        </g>
      </g>
      
      <!-- Next Steps -->
      <g transform="translate(900, 0)">
        <rect width="250" height="200" fill="url(#agileGrad4)" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle" font-weight="600">Next Steps</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">- Performance Optimization</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">- New Features</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">- Security Enhancements</text>
        </g>
      </g>
    </g>
  </g>
</svg>
