<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700">
  <defs>
    <linearGradient id="gradientRewards" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb8c00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Phone Frame -->
  <rect width="400" height="700" fill="#1a1a1a" rx="40"/>
  <rect x="20" y="40" width="360" height="620" fill="#ffffff" rx="30"/>
  
  <!-- Status Bar -->
  <rect x="20" y="40" width="360" height="30" fill="#ff9800"/>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">9:41 AM</text>
  
  <!-- Header -->
  <rect x="20" y="70" width="360" height="60" fill="url(#gradientRewards)"/>
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Rewards &amp; Games</text>
  
  <!-- Rewards Points Card -->
  <rect x="40" y="150" width="320" height="120" fill="url(#gradientRewards)" rx="12"/>
  <circle cx="200" cy="200" r="30" fill="#ffffff" opacity="0.3"/>
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Your Points</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">2,450</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Available for redemption</text>
  
  <!-- Spin & Win Section -->
  <text x="40" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a237e">Spin &amp; Win</text>
  
  <!-- Spin Wheel -->
  <circle cx="200" cy="400" r="100" fill="#f8f9fa" stroke="#ff9800" stroke-width="4"/>
  <circle cx="200" cy="400" r="80" fill="#ffffff"/>
  
  <!-- Wheel Segments -->
  <path d="M 200 400 L 200 320 A 80 80 0 0 1 280 400 Z" fill="#ff9800"/>
  <path d="M 200 400 L 280 400 A 80 80 0 0 1 200 480 Z" fill="#4caf50"/>
  <path d="M 200 400 L 200 480 A 80 80 0 0 1 120 400 Z" fill="#3949ab"/>
  <path d="M 200 400 L 120 400 A 80 80 0 0 1 200 320 Z" fill="#ff5722"/>
  
  <!-- Center Circle -->
  <circle cx="200" cy="400" r="30" fill="#1a237e"/>
  <text x="200" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SPIN</text>
  
  <!-- Spin Button -->
  <rect x="150" y="520" width="100" height="40" fill="#ff9800" rx="20"/>
  <text x="200" y="545" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Spin Now</text>
  
  <!-- Referrals Section -->
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a237e">Refer &amp; Earn</text>
  
  <rect x="40" y="620" width="320" height="60" fill="#e3f2fd" rx="8"/>
  <circle cx="80" cy="650" r="20" fill="#3949ab"/>
  <text x="80" y="656" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <text x="110" y="640" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e">Invite Friends</text>
  <text x="110" y="660" font-family="Arial, sans-serif" font-size="12" fill="#666">Earn 500 points per referral</text>
  <text x="340" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3949ab" text-anchor="end">&gt;</text>
</svg>

