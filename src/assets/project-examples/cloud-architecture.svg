<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cloud Platform -->
  <ellipse cx="400" cy="100" rx="150" ry="50" fill="#f8f9fa" stroke="#007bff" stroke-width="2"/>
  <text x="400" y="110" font-family="Arial" font-size="20" fill="#007bff" text-anchor="middle">Cloud Platform</text>
  
  <!-- Container Orchestration -->
  <g transform="translate(200, 200)">
    <rect width="120" height="80" rx="10" fill="#f8f9fa" stroke="#28a745" stroke-width="2"/>
    <text x="60" y="35" font-family="Arial" font-size="14" fill="#28a745" text-anchor="middle">Container</text>
    <text x="60" y="55" font-family="Arial" font-size="14" fill="#28a745" text-anchor="middle">Orchestration</text>
  </g>
  
  <!-- CI/CD Pipeline -->
  <g transform="translate(480, 200)">
    <rect width="120" height="80" rx="10" fill="#f8f9fa" stroke="#dc3545" stroke-width="2"/>
    <text x="60" y="35" font-family="Arial" font-size="14" fill="#dc3545" text-anchor="middle">CI/CD</text>
    <text x="60" y="55" font-family="Arial" font-size="14" fill="#dc3545" text-anchor="middle">Pipeline</text>
  </g>
  
  <!-- Monitoring -->
  <g transform="translate(200, 400)">
    <rect width="120" height="80" rx="10" fill="#f8f9fa" stroke="#17a2b8" stroke-width="2"/>
    <text x="60" y="45" font-family="Arial" font-size="14" fill="#17a2b8" text-anchor="middle">Monitoring</text>
  </g>
  
  <!-- Security -->
  <g transform="translate(480, 400)">
    <rect width="120" height="80" rx="10" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
    <text x="60" y="45" font-family="Arial" font-size="14" fill="#6c757d" text-anchor="middle">Security</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="400" y1="150" x2="260" y2="200" stroke="#dee2e6" stroke-width="2"/>
  <line x1="400" y1="150" x2="540" y2="200" stroke="#dee2e6" stroke-width="2"/>
  <line x1="260" y1="280" x2="260" y2="400" stroke="#dee2e6" stroke-width="2"/>
  <line x1="540" y1="280" x2="540" y2="400" stroke="#dee2e6" stroke-width="2"/>
  <line x1="320" y1="240" x2="480" y2="240" stroke="#dee2e6" stroke-width="2"/>
  <line x1="320" y1="440" x2="480" y2="440" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Kubernetes Pods -->
  <g transform="translate(180, 300)">
    <circle cx="20" cy="20" r="10" fill="#28a745" opacity="0.2"/>
    <circle cx="50" cy="20" r="10" fill="#28a745" opacity="0.2"/>
    <circle cx="35" cy="40" r="10" fill="#28a745" opacity="0.2"/>
  </g>
  
  <!-- Pipeline Steps -->
  <g transform="translate(460, 300)">
    <rect x="20" y="10" width="20" height="20" rx="5" fill="#dc3545" opacity="0.2"/>
    <rect x="50" y="10" width="20" height="20" rx="5" fill="#dc3545" opacity="0.2"/>
    <rect x="80" y="10" width="20" height="20" rx="5" fill="#dc3545" opacity="0.2"/>
  </g>
  
  <!-- Monitoring Graphs -->
  <g transform="translate(180, 500)">
    <path d="M10 0 L30 -20 L50 -10 L70 -30" stroke="#17a2b8" stroke-width="2" fill="none" transform="scale(1, -1)"/>
  </g>
  
  <!-- Security Shield -->
  <g transform="translate(460, 500)">
    <path d="M60 0 L80 -10 L60 -40 L40 -10 Z" stroke="#6c757d" stroke-width="2" fill="none"/>
  </g>
</svg>
