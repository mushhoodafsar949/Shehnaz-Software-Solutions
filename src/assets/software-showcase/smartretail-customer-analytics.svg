<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" rx="20"/>
  
  <!-- Header -->
  <g transform="translate(40, 40)">
    <text x="0" y="30" fill="#1e293b" font-family="Arial" font-size="24" font-weight="bold">Customer Analytics</text>
    <text x="0" y="60" fill="#64748b" font-family="Arial" font-size="16">Customer behavior and engagement insights</text>
  </g>
  
  <!-- Customer Demographics -->
  <g transform="translate(40, 120)">
    <rect width="360" height="220" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">Demographics</text>
    
    <!-- Pie Chart -->
    <g transform="translate(40, 60)">
      <!-- Age Groups -->
      <path d="M100,80 L180,80 A80,80 0 0,1 140,152 Z" fill="#FF5722" opacity="0.8"/>
      <path d="M100,80 L140,152 A80,80 0 0,1 20,80 Z" fill="#FF5722" opacity="0.6"/>
      <path d="M100,80 L20,80 A80,80 0 0,1 100,0 Z" fill="#FF5722" opacity="0.4"/>
      <path d="M100,80 L100,0 A80,80 0 0,1 180,80 Z" fill="#FF5722" opacity="0.2"/>
      
      <!-- Legend -->
      <g transform="translate(200, 0)">
        <rect width="12" height="12" fill="#FF5722" opacity="0.8"/>
        <text x="20" y="10" fill="#64748b" font-family="Arial" font-size="12">18-24 (35%)</text>
        
        <rect y="20" width="12" height="12" fill="#FF5722" opacity="0.6"/>
        <text x="20" y="30" fill="#64748b" font-family="Arial" font-size="12">25-34 (28%)</text>
        
        <rect y="40" width="12" height="12" fill="#FF5722" opacity="0.4"/>
        <text x="20" y="50" fill="#64748b" font-family="Arial" font-size="12">35-44 (22%)</text>
        
        <rect y="60" width="12" height="12" fill="#FF5722" opacity="0.2"/>
        <text x="20" y="70" fill="#64748b" font-family="Arial" font-size="12">45+ (15%)</text>
      </g>
    </g>
  </g>
  
  <!-- Customer Journey -->
  <g transform="translate(420, 120)">
    <rect width="340" height="220" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">Customer Journey</text>
    
    <!-- Journey Steps -->
    <g transform="translate(20, 70)">
      <!-- Awareness -->
      <circle cx="20" cy="20" r="10" fill="#FF5722"/>
      <text x="40" y="25" fill="#1e293b" font-family="Arial" font-size="14">Awareness</text>
      <text x="200" y="25" fill="#FF5722" font-family="Arial" font-size="14">85%</text>
      
      <!-- Consideration -->
      <circle cx="20" cy="60" r="10" fill="#FF5722" opacity="0.8"/>
      <text x="40" y="65" fill="#1e293b" font-family="Arial" font-size="14">Consideration</text>
      <text x="200" y="65" fill="#FF5722" font-family="Arial" font-size="14">62%</text>
      
      <!-- Purchase -->
      <circle cx="20" cy="100" r="10" fill="#FF5722" opacity="0.6"/>
      <text x="40" y="105" fill="#1e293b" font-family="Arial" font-size="14">Purchase</text>
      <text x="200" y="105" fill="#FF5722" font-family="Arial" font-size="14">45%</text>
      
      <!-- Loyalty -->
      <circle cx="20" cy="140" r="10" fill="#FF5722" opacity="0.4"/>
      <text x="40" y="145" fill="#1e293b" font-family="Arial" font-size="14">Loyalty</text>
      <text x="200" y="145" fill="#FF5722" font-family="Arial" font-size="14">28%</text>
    </g>
  </g>
  
  <!-- Engagement Metrics -->
  <g transform="translate(40, 360)">
    <rect width="720" height="200" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">Engagement Metrics</text>
    
    <!-- Metrics Grid -->
    <g transform="translate(20, 60)">
      <!-- Visit Frequency -->
      <g>
        <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">Visit Frequency</text>
        <rect x="0" y="30" width="200" height="8" fill="#f1f5f9" rx="4"/>
        <rect x="0" y="30" width="160" height="8" fill="#FF5722" rx="4"/>
        <text x="0" y="55" fill="#1e293b" font-family="Arial" font-size="16">4.2 visits/month</text>
      </g>
      
      <!-- Avg Time Spent -->
      <g transform="translate(240, 0)">
        <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">Avg Time Spent</text>
        <rect x="0" y="30" width="200" height="8" fill="#f1f5f9" rx="4"/>
        <rect x="0" y="30" width="140" height="8" fill="#FF5722" rx="4"/>
        <text x="0" y="55" fill="#1e293b" font-family="Arial" font-size="16">18 minutes</text>
      </g>
      
      <!-- Conversion Rate -->
      <g transform="translate(480, 0)">
        <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">Conversion Rate</text>
        <rect x="0" y="30" width="200" height="8" fill="#f1f5f9" rx="4"/>
        <rect x="0" y="30" width="120" height="8" fill="#FF5722" rx="4"/>
        <text x="0" y="55" fill="#1e293b" font-family="Arial" font-size="16">3.8%</text>
      </g>
      
      <!-- Customer Satisfaction -->
      <g transform="translate(0, 80)">
        <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">Customer Satisfaction</text>
        <rect x="0" y="30" width="200" height="8" fill="#f1f5f9" rx="4"/>
        <rect x="0" y="30" width="180" height="8" fill="#FF5722" rx="4"/>
        <text x="0" y="55" fill="#1e293b" font-family="Arial" font-size="16">4.5/5.0</text>
      </g>
      
      <!-- Repeat Purchase -->
      <g transform="translate(240, 80)">
        <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">Repeat Purchase</text>
        <rect x="0" y="30" width="200" height="8" fill="#f1f5f9" rx="4"/>
        <rect x="0" y="30" width="150" height="8" fill="#FF5722" rx="4"/>
        <text x="0" y="55" fill="#1e293b" font-family="Arial" font-size="16">65%</text>
      </g>
      
      <!-- Customer Lifetime Value -->
      <g transform="translate(480, 80)">
        <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">Customer LTV</text>
        <rect x="0" y="30" width="200" height="8" fill="#f1f5f9" rx="4"/>
        <rect x="0" y="30" width="170" height="8" fill="#FF5722" rx="4"/>
        <text x="0" y="55" fill="#1e293b" font-family="Arial" font-size="16">$850</text>
      </g>
    </g>
  </g>
</svg>
