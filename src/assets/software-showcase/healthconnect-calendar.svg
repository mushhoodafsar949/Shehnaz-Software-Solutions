<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" rx="20"/>
  
  <!-- Calendar Header -->
  <g transform="translate(40, 40)">
    <rect width="720" height="80" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="50" fill="#1e293b" font-family="Arial" font-size="24" font-weight="bold">September 2023</text>
    
    <!-- Navigation -->
    <g transform="translate(560, 30)">
      <circle cx="20" cy="20" r="15" fill="#f1f5f9"/>
      <text x="20" y="25" fill="#64748b" font-family="Arial" font-size="18" text-anchor="middle">←</text>
      <circle cx="60" cy="20" r="15" fill="#f1f5f9"/>
      <text x="60" y="25" fill="#64748b" font-family="Arial" font-size="18" text-anchor="middle">→</text>
      <circle cx="100" cy="20" r="15" fill="#6366f1"/>
      <text x="100" y="25" fill="white" font-family="Arial" font-size="14" text-anchor="middle">Today</text>
    </g>
  </g>
  
  <!-- Calendar Grid -->
  <g transform="translate(40, 140)">
    <rect width="720" height="420" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    
    <!-- Days of Week -->
    <g transform="translate(20, 20)">
      <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">Sun</text>
      <text x="100" y="20" fill="#64748b" font-family="Arial" font-size="14">Mon</text>
      <text x="200" y="20" fill="#64748b" font-family="Arial" font-size="14">Tue</text>
      <text x="300" y="20" fill="#64748b" font-family="Arial" font-size="14">Wed</text>
      <text x="400" y="20" fill="#64748b" font-family="Arial" font-size="14">Thu</text>
      <text x="500" y="20" fill="#64748b" font-family="Arial" font-size="14">Fri</text>
      <text x="600" y="20" fill="#64748b" font-family="Arial" font-size="14">Sat</text>
    </g>
    
    <!-- Calendar Days -->
    <g transform="translate(20, 60)">
      <!-- Week 1 -->
      <g>
        <rect width="80" height="80" fill="#f8fafc" rx="5"/>
        <text x="10" y="20" fill="#94a3b8" font-family="Arial" font-size="14">27</text>
      </g>
      <g transform="translate(100, 0)">
        <rect width="80" height="80" fill="#f8fafc" rx="5"/>
        <text x="10" y="20" fill="#94a3b8" font-family="Arial" font-size="14">28</text>
      </g>
      <g transform="translate(200, 0)">
        <rect width="80" height="80" fill="#f8fafc" rx="5"/>
        <text x="10" y="20" fill="#94a3b8" font-family="Arial" font-size="14">29</text>
      </g>
      <g transform="translate(300, 0)">
        <rect width="80" height="80" fill="#f8fafc" rx="5"/>
        <text x="10" y="20" fill="#94a3b8" font-family="Arial" font-size="14">30</text>
      </g>
      <g transform="translate(400, 0)">
        <rect width="80" height="80" fill="#f8fafc" rx="5"/>
        <text x="10" y="20" fill="#94a3b8" font-family="Arial" font-size="14">31</text>
      </g>
      <g transform="translate(500, 0)">
        <rect width="80" height="80" fill="white" rx="5"/>
        <text x="10" y="20" fill="#1e293b" font-family="Arial" font-size="14">1</text>
      </g>
      <g transform="translate(600, 0)">
        <rect width="80" height="80" fill="white" rx="5"/>
        <text x="10" y="20" fill="#1e293b" font-family="Arial" font-size="14">2</text>
      </g>
      
      <!-- Week 2 -->
      <g transform="translate(0, 100)">
        <rect width="80" height="80" fill="white" rx="5"/>
        <text x="10" y="20" fill="#1e293b" font-family="Arial" font-size="14">3</text>
      </g>
      <g transform="translate(100, 100)">
        <rect width="80" height="80" fill="white" rx="5"/>
        <text x="10" y="20" fill="#1e293b" font-family="Arial" font-size="14">4</text>
        <!-- Appointment -->
        <rect x="10" y="35" width="60" height="20" fill="#818cf8" rx="3"/>
        <text x="15" y="50" fill="white" font-family="Arial" font-size="10">9:00 AM</text>
      </g>
      <g transform="translate(200, 100)">
        <rect width="80" height="80" fill="#ede9fe" rx="5"/>
        <text x="10" y="20" fill="#1e293b" font-family="Arial" font-size="14">5</text>
        <!-- Current Day -->
        <circle cx="65" cy="15" r="8" fill="#6366f1"/>
        <!-- Appointments -->
        <rect x="10" y="35" width="60" height="20" fill="#818cf8" rx="3"/>
        <text x="15" y="50" fill="white" font-family="Arial" font-size="10">10:30 AM</text>
        <rect x="10" y="50" width="60" height="20" fill="#818cf8" rx="3"/>
        <text x="15" y="65" fill="white" font-family="Arial" font-size="10">2:00 PM</text>
      </g>
      <!-- Remaining days... -->
    </g>
  </g>
</svg>
