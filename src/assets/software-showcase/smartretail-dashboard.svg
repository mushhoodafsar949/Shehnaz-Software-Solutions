<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" rx="20"/>
  
  <!-- Header -->
  <g transform="translate(40, 40)">
    <rect width="720" height="80" fill="#FF5722" rx="10"/>
    <text x="40" y="50" fill="white" font-family="Arial" font-size="24">Retail Dashboard</text>
    
    <!-- Quick Stats -->
    <g transform="translate(400, 20)">
      <text x="0" y="20" fill="white" font-family="Arial" font-size="14">Today's Sales</text>
      <text x="0" y="45" fill="white" font-family="Arial" font-size="24" font-weight="bold">$12,450</text>
    </g>
  </g>
  
  <!-- Sales Chart -->
  <g transform="translate(40, 140)">
    <rect width="460" height="280" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">Sales Overview</text>
    
    <!-- Chart -->
    <g transform="translate(20, 60)">
      <!-- Grid -->
      <path d="M0 180h420M0 0v180" stroke="#e2e8f0" stroke-width="1"/>
      <path d="M0 45h420M0 90h420M0 135h420" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
      
      <!-- Bar Chart -->
      <g>
        <rect x="30" y="60" width="40" height="120" fill="#FF5722" opacity="0.2"/>
        <rect x="90" y="40" width="40" height="140" fill="#FF5722" opacity="0.3"/>
        <rect x="150" y="20" width="40" height="160" fill="#FF5722" opacity="0.4"/>
        <rect x="210" y="80" width="40" height="100" fill="#FF5722" opacity="0.5"/>
        <rect x="270" y="40" width="40" height="140" fill="#FF5722" opacity="0.6"/>
        <rect x="330" y="60" width="40" height="120" fill="#FF5722" opacity="0.7"/>
      </g>
    </g>
  </g>
  
  <!-- Top Products -->
  <g transform="translate(520, 140)">
    <rect width="240" height="280" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">Top Products</text>
    
    <!-- Product List -->
    <g transform="translate(20, 60)">
      <!-- Product 1 -->
      <rect width="200" height="40" rx="5" fill="#FBE9E7"/>
      <text x="10" y="25" fill="#1e293b" font-family="Arial" font-size="14">Product A</text>
      <text x="150" y="25" fill="#FF5722" font-family="Arial" font-size="14">$2,450</text>
      
      <!-- Product 2 -->
      <g transform="translate(0, 50)">
        <rect width="200" height="40" rx="5" fill="#FBE9E7"/>
        <text x="10" y="25" fill="#1e293b" font-family="Arial" font-size="14">Product B</text>
        <text x="150" y="25" fill="#FF5722" font-family="Arial" font-size="14">$1,890</text>
      </g>
      
      <!-- Product 3 -->
      <g transform="translate(0, 100)">
        <rect width="200" height="40" rx="5" fill="#FBE9E7"/>
        <text x="10" y="25" fill="#1e293b" font-family="Arial" font-size="14">Product C</text>
        <text x="150" y="25" fill="#FF5722" font-family="Arial" font-size="14">$1,230</text>
      </g>
    </g>
  </g>
  
  <!-- Bottom Stats -->
  <g transform="translate(40, 440)">
    <!-- Orders -->
    <rect width="230" height="120" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="16" font-weight="bold">Orders</text>
    <text x="20" y="80" fill="#FF5722" font-family="Arial" font-size="32">245</text>
    <text x="90" y="80" fill="#64748b" font-family="Arial" font-size="14">+12% vs yesterday</text>
    
    <!-- Revenue -->
    <g transform="translate(250, 0)">
      <rect width="230" height="120" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
      <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="16" font-weight="bold">Revenue</text>
      <text x="20" y="80" fill="#FF5722" font-family="Arial" font-size="32">$8.5K</text>
      <text x="100" y="80" fill="#64748b" font-family="Arial" font-size="14">+8% vs yesterday</text>
    </g>
    
    <!-- Customers -->
    <g transform="translate(500, 0)">
      <rect width="230" height="120" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
      <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="16" font-weight="bold">Customers</text>
      <text x="20" y="80" fill="#FF5722" font-family="Arial" font-size="32">189</text>
      <text x="90" y="80" fill="#64748b" font-family="Arial" font-size="14">+5% vs yesterday</text>
    </g>
  </g>
</svg>
