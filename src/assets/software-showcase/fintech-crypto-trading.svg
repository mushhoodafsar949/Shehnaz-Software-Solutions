<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" rx="20"/>
  
  <!-- Trading Interface -->
  <g transform="translate(40, 40)">
    <!-- Chart Area -->
    <rect width="480" height="320" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">BTC/USD</text>
    <text x="100" y="40" fill="#10B981" font-family="Arial" font-size="18">$45,230.50 +2.4%</text>
    
    <!-- Candlestick Chart -->
    <g transform="translate(20, 60)">
      <!-- Grid -->
      <path d="M0 0v220M0 220h440" stroke="#e2e8f0" stroke-width="1"/>
      <path d="M0 55h440M0 110h440M0 165h440" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
      
      <!-- Candlesticks -->
      <g transform="translate(40, 0)">
        <!-- Green Candle -->
        <line x1="10" y1="80" x2="10" y2="140" stroke="#10B981" stroke-width="2"/>
        <rect x="5" y="90" width="10" height="40" fill="#10B981"/>
      </g>
      <g transform="translate(80, 0)">
        <!-- Red Candle -->
        <line x1="10" y1="60" x2="10" y2="120" stroke="#EF4444" stroke-width="2"/>
        <rect x="5" y="60" width="10" height="40" fill="#EF4444"/>
      </g>
      <g transform="translate(120, 0)">
        <!-- Green Candle -->
        <line x1="10" y1="100" x2="10" y2="160" stroke="#10B981" stroke-width="2"/>
        <rect x="5" y="110" width="10" height="40" fill="#10B981"/>
      </g>
      <!-- More candlesticks... -->
    </g>
  </g>
  
  <!-- Order Book -->
  <g transform="translate(540, 40)">
    <rect width="220" height="320" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">Order Book</text>
    
    <!-- Buy Orders -->
    <g transform="translate(20, 60)">
      <text x="0" y="20" fill="#10B981" font-family="Arial" font-size="14">Buy Orders</text>
      <text x="0" y="45" fill="#64748b" font-family="Arial" font-size="14">45,200.00</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="14">0.5 BTC</text>
      <text x="0" y="70" fill="#64748b" font-family="Arial" font-size="14">45,150.00</text>
      <text x="100" y="70" fill="#64748b" font-family="Arial" font-size="14">1.2 BTC</text>
    </g>
    
    <!-- Sell Orders -->
    <g transform="translate(20, 160)">
      <text x="0" y="20" fill="#EF4444" font-family="Arial" font-size="14">Sell Orders</text>
      <text x="0" y="45" fill="#64748b" font-family="Arial" font-size="14">45,300.00</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="14">0.8 BTC</text>
      <text x="0" y="70" fill="#64748b" font-family="Arial" font-size="14">45,350.00</text>
      <text x="100" y="70" fill="#64748b" font-family="Arial" font-size="14">1.5 BTC</text>
    </g>
  </g>
  
  <!-- Trading Form -->
  <g transform="translate(40, 380)">
    <rect width="720" height="180" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    
    <!-- Buy Form -->
    <g transform="translate(20, 20)">
      <text x="0" y="30" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">Buy BTC</text>
      
      <!-- Amount Input -->
      <rect x="0" y="50" width="200" height="40" fill="#f1f5f9" rx="5"/>
      <text x="10" y="75" fill="#64748b" font-family="Arial" font-size="14">Amount (BTC)</text>
      
      <!-- Price Input -->
      <rect x="220" y="50" width="200" height="40" fill="#f1f5f9" rx="5"/>
      <text x="230" y="75" fill="#64748b" font-family="Arial" font-size="14">Price (USD)</text>
      
      <!-- Buy Button -->
      <rect x="440" y="50" width="100" height="40" fill="#10B981" rx="5"/>
      <text x="470" y="75" fill="white" font-family="Arial" font-size="14">Buy</text>
    </g>
    
    <!-- Sell Form -->
    <g transform="translate(20, 100)">
      <text x="0" y="30" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold">Sell BTC</text>
      
      <!-- Amount Input -->
      <rect x="0" y="50" width="200" height="40" fill="#f1f5f9" rx="5"/>
      <text x="10" y="75" fill="#64748b" font-family="Arial" font-size="14">Amount (BTC)</text>
      
      <!-- Price Input -->
      <rect x="220" y="50" width="200" height="40" fill="#f1f5f9" rx="5"/>
      <text x="230" y="75" fill="#64748b" font-family="Arial" font-size="14">Price (USD)</text>
      
      <!-- Sell Button -->
      <rect x="440" y="50" width="100" height="40" fill="#EF4444" rx="5"/>
      <text x="470" y="75" fill="white" font-family="Arial" font-size="14">Sell</text>
    </g>
  </g>
</svg>
