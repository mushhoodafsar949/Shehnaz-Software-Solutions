<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="k8sSimpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">Kubernetes Simple Architecture</text>
  
  <!-- Cluster Boundary -->
  <rect x="150" y="80" width="500" height="250" rx="15" stroke="#22c55e" stroke-width="2" fill="none"/>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="16" fill="#166534" text-anchor="middle" font-weight="bold">Kubernetes Cluster</text>
  
  <!-- Master Node -->
  <rect x="200" y="130" width="120" height="60" rx="8" fill="url(#k8sSimpleGradient)"/>
  <text x="260" y="150" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Master Node</text>
  <text x="260" y="165" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">API Server</text>
  <text x="260" y="178" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Scheduler</text>
  
  <!-- Worker Nodes -->
  <rect x="380" y="130" width="100" height="60" rx="8" fill="#64748b"/>
  <text x="430" y="150" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Worker 1</text>
  <text x="430" y="165" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Kubelet</text>
  <text x="430" y="178" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Pods</text>
  
  <rect x="500" y="130" width="100" height="60" rx="8" fill="#64748b"/>
  <text x="550" y="150" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Worker 2</text>
  <text x="550" y="165" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Kubelet</text>
  <text x="550" y="178" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Pods</text>
  
  <!-- Pods -->
  <rect x="390" y="210" width="30" height="30" rx="4" fill="#22c55e"/>
  <text x="405" y="230" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Pod</text>
  
  <rect x="440" y="210" width="30" height="30" rx="4" fill="#22c55e"/>
  <text x="455" y="230" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Pod</text>
  
  <rect x="510" y="210" width="30" height="30" rx="4" fill="#22c55e"/>
  <text x="525" y="230" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Pod</text>
  
  <rect x="560" y="210" width="30" height="30" rx="4" fill="#22c55e"/>
  <text x="575" y="230" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Pod</text>
  
  <!-- Service -->
  <rect x="430" y="270" width="80" height="30" rx="6" fill="#3b82f6"/>
  <text x="470" y="290" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Service</text>
  
  <!-- External Access -->
  <rect x="50" y="160" width="80" height="40" rx="6" fill="#f59e0b"/>
  <text x="90" y="185" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Load Balancer</text>
  
  <!-- Connection Lines -->
  <line x1="130" y1="180" x2="200" y2="160" stroke="#22c55e" stroke-width="2"/>
  <line x1="320" y1="160" x2="380" y2="160" stroke="#22c55e" stroke-width="2"/>
  <line x1="320" y1="160" x2="500" y2="160" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Features -->
  <g transform="translate(100, 350)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#166534" font-weight="bold">Features:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#64748b">• Container orchestration • Auto-scaling • Service discovery • Load balancing</text>
  </g>
</svg>