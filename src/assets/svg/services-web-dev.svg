<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Browser Window -->
  <g transform="translate(50, 50)">
    <!-- Browser Frame -->
    <rect x="0" y="0" width="300" height="200" rx="8" fill="#1e293b"/>
    <rect x="5" y="25" width="290" height="170" rx="4" fill="white"/>
    
    <!-- Browser Header -->
    <rect x="0" y="0" width="300" height="25" rx="8" fill="url(#webGradient)"/>
    <circle cx="15" cy="12" r="4" fill="#ef4444"/>
    <circle cx="30" cy="12" r="4" fill="#f59e0b"/>
    <circle cx="45" cy="12" r="4" fill="#10b981"/>
    
    <!-- Address Bar -->
    <rect x="70" y="7" width="150" height="11" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="145" y="15" font-family="monospace" font-size="8" fill="white" text-anchor="middle">nesttechsolutions.com</text>
    
    <!-- Website Content -->
    <rect x="15" y="40" width="270" height="30" rx="4" fill="url(#webGradient)" opacity="0.8"/>
    <text x="150" y="58" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Nest Tech Solutions</text>
    
    <!-- Content Blocks -->
    <rect x="15" y="80" width="80" height="60" rx="4" fill="#e2e8f0"/>
    <rect x="110" y="80" width="80" height="60" rx="4" fill="#e2e8f0"/>
    <rect x="205" y="80" width="80" height="60" rx="4" fill="#e2e8f0"/>
    
    <!-- Service Icons -->
    <circle cx="55" cy="110" r="15" fill="url(#webGradient)"/>
    <text x="55" y="115" font-family="Arial" font-size="10" fill="white" text-anchor="middle">WEB</text>
    
    <circle cx="150" cy="110" r="15" fill="url(#webGradient)"/>
    <text x="150" y="115" font-family="Arial" font-size="10" fill="white" text-anchor="middle">APP</text>
    
    <circle cx="245" cy="110" r="15" fill="url(#webGradient)"/>
    <text x="245" y="115" font-family="Arial" font-size="10" fill="white" text-anchor="middle">API</text>
    
    <!-- Footer -->
    <rect x="15" y="155" width="270" height="30" rx="4" fill="#f1f5f9"/>
    <text x="150" y="173" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Custom Web Development Solutions</text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="350" cy="50" r="20" fill="url(#webGradient)" opacity="0.3"/>
  <circle cx="30" cy="250" r="15" fill="url(#webGradient)" opacity="0.3"/>
</svg>
