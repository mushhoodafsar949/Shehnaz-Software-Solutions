<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="#f8fafc"/>
  
  <!-- Browser Window -->
  <rect x="50" y="50" width="300" height="200" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect x="50" y="50" width="300" height="30" rx="10 10 0 0" fill="#e2e8f0"/>
  <circle cx="65" cy="65" r="5" fill="#ef4444"/>
  <circle cx="80" cy="65" r="5" fill="#f97316"/>
  <circle cx="95" cy="65" r="5" fill="#22c55e"/>
  <rect x="110" y="60" width="200" height="10" rx="5" fill="#cbd5e1"/>
  
  <!-- Web Page Content -->
  <rect x="60" y="90" width="280" height="20" rx="5" fill="url(#webGradient)"/>
  <rect x="60" y="120" width="150" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="220" y="120" width="120" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="60" y="140" width="280" height="60" rx="5" fill="#f1f5f9"/>
  <rect x="60" y="210" width="100" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="170" y="210" width="170" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="60" y="230" width="280" height="10" rx="3" fill="#cbd5e1"/>
</svg>