<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="monolithGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    <linearGradient id="microGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">Monolith to Microservices Migration</text>
  
  <!-- Monolith -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="url(#monolithGradient)"/>
    <text x="60" y="25" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Monolith</text>
    <text x="60" y="50" font-family="Arial" font-size="10" fill="white" text-anchor="middle">User Module</text>
    <text x="60" y="70" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Order Module</text>
    <text x="60" y="90" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Payment Module</text>
    <text x="60" y="110" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Inventory Module</text>
    <text x="60" y="130" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Shared Database</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 250 175 L 350 175" stroke="#22c55e" stroke-width="4" fill="none"/>
  <text x="300" y="165" font-family="Arial" font-size="12" fill="#166534" text-anchor="middle" font-weight="bold">Migrate</text>
  
  <!-- Microservices -->
  <g transform="translate(400, 80)">
    <rect x="0" y="0" width="80" height="60" rx="6" fill="url(#microGradient)"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">User Service</text>
    <text x="40" y="40" font-family="Arial" font-size="8" fill="white" text-anchor="middle">+ User DB</text>
  </g>
  
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="80" height="60" rx="6" fill="url(#microGradient)"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Order Service</text>
    <text x="40" y="40" font-family="Arial" font-size="8" fill="white" text-anchor="middle">+ Order DB</text>
  </g>
  
  <g transform="translate(400, 160)">
    <rect x="0" y="0" width="80" height="60" rx="6" fill="url(#microGradient)"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Payment Service</text>
    <text x="40" y="40" font-family="Arial" font-size="8" fill="white" text-anchor="middle">+ Payment DB</text>
  </g>
  
  <g transform="translate(500, 160)">
    <rect x="0" y="0" width="80" height="60" rx="6" fill="url(#microGradient)"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Inventory Service</text>
    <text x="40" y="40" font-family="Arial" font-size="8" fill="white" text-anchor="middle">+ Inventory DB</text>
  </g>
  
  <!-- API Gateway -->
  <g transform="translate(620, 140)">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="#3b82f6"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">API Gateway</text>
  </g>
  
  <!-- Benefits -->
  <g transform="translate(100, 300)">
    <text x="0" y="0" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">Migration Benefits:</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#64748b">• Independent scaling • Technology diversity • Fault isolation</text>
    <text x="0" y="35" font-family="Arial" font-size="12" fill="#64748b">• Faster deployment • Team autonomy • Better maintainability</text>
  </g>
</svg>