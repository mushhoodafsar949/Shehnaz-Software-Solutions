<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#166534;stop-opacity:0.2" />
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with subtle animation -->
  <rect width="400" height="300" fill="#f8fafc">
    <animate attributeName="fill" values="#f8fafc;#f1f5f9;#f8fafc" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating Code Particles -->
  <g opacity="0.3">
    <text x="50" y="50" font-family="monospace" font-size="12" fill="#22c55e" transform="rotate(15)">
      &lt;/&gt;
      <animateTransform attributeName="transform" type="rotate" values="15;25;15" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="80" font-family="monospace" font-size="10" fill="#166534" transform="rotate(-10)">
      { }
      <animateTransform attributeName="transform" type="rotate" values="-10;0;-10" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="250" font-family="monospace" font-size="8" fill="#4ade80" transform="rotate(20)">
      console.log()
      <animateTransform attributeName="transform" type="rotate" values="20;30;20" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Main Browser Window -->
  <g transform="translate(50, 50)" filter="url(#dropShadow)">
    <!-- Browser Frame with Glow -->
    <rect x="0" y="0" width="300" height="200" rx="12" fill="#1e293b" filter="url(#glow)"/>
    <rect x="4" y="28" width="292" height="168" rx="8" fill="white"/>
    
    <!-- Animated Screen Glow -->
    <rect x="4" y="28" width="292" height="168" rx="8" fill="url(#screenGlow)" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Browser Header with Animation -->
    <rect x="0" y="0" width="300" height="28" rx="12" fill="url(#webGradient)">
      <animate attributeName="fill" values="url(#webGradient);#22c55e;url(#webGradient)" dur="8s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Traffic Light Buttons -->
    <circle cx="18" cy="14" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="14" r="5" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Address Bar with Typing Animation -->
    <rect x="80" y="8" width="180" height="12" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="170" y="17" font-family="monospace" font-size="8" fill="white" text-anchor="middle">
      <animate attributeName="opacity" values="0;1;1;1" dur="2s" fill="freeze"/>
      nesttechsolutions.com
    </text>
    
    <!-- Loading Bar Animation -->
    <rect x="80" y="21" width="0" height="2" rx="1" fill="#4ade80">
      <animate attributeName="width" values="0;180;0" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Website Header -->
    <rect x="12" y="40" width="276" height="35" rx="6" fill="url(#webGradient)" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="150" y="60" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">
      Nest Tech AI Solutions
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0.5s" fill="freeze"/>
    </text>

    <!-- Navigation Menu -->
    <g transform="translate(20, 85)" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
      <text x="0" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1s" fill="freeze"/>
        Home
      </text>
      <text x="40" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.2s" fill="freeze"/>
        Services
      </text>
      <text x="80" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.4s" fill="freeze"/>
        About
      </text>
      <text x="115" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.6s" fill="freeze"/>
        Contact
      </text>
    </g>

    <!-- Service Cards with Staggered Animation -->
    <g transform="translate(20, 105)">
      <!-- Card 1: Web Development -->
      <rect x="0" y="0" width="70" height="65" rx="6" fill="#e2e8f0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0,20;0,0" dur="1s" begin="2s" fill="freeze"/>
      </rect>
      <circle cx="35" cy="25" r="12" fill="url(#webGradient)">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.2s" fill="freeze"/>
        <animate attributeName="r" values="8;12;12" dur="0.5s" begin="2.2s" fill="freeze"/>
      </circle>
      <text x="35" y="30" font-family="monospace" font-size="8" fill="white" text-anchor="middle">&lt;/&gt;</text>
      <text x="35" y="45" font-family="Arial, sans-serif" font-size="7" fill="#166534" text-anchor="middle" font-weight="bold">Web Dev</text>
      <text x="35" y="55" font-family="Arial, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">React, Vue</text>

      <!-- Card 2: Mobile Apps -->
      <rect x="80" y="0" width="70" height="65" rx="6" fill="#e2e8f0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0,20;0,0" dur="1s" begin="2.3s" fill="freeze"/>
      </rect>
      <circle cx="115" cy="25" r="12" fill="url(#webGradient)">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.5s" fill="freeze"/>
        <animate attributeName="r" values="8;12;12" dur="0.5s" begin="2.5s" fill="freeze"/>
      </circle>
      <rect x="110" y="20" width="10" height="10" rx="2" fill="white"/>
      <text x="115" y="45" font-family="Arial, sans-serif" font-size="7" fill="#166534" text-anchor="middle" font-weight="bold">Mobile</text>
      <text x="115" y="55" font-family="Arial, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">iOS, Android</text>

      <!-- Card 3: Cloud Services -->
      <rect x="160" y="0" width="70" height="65" rx="6" fill="#e2e8f0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0,20;0,0" dur="1s" begin="2.6s" fill="freeze"/>
      </rect>
      <circle cx="195" cy="25" r="12" fill="url(#webGradient)">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.8s" fill="freeze"/>
        <animate attributeName="r" values="8;12;12" dur="0.5s" begin="2.8s" fill="freeze"/>
      </circle>
      <!-- Cloud Icon -->
      <ellipse cx="195" cy="25" rx="8" ry="4" fill="white"/>
      <circle cx="189" cy="25" r="3" fill="white"/>
      <circle cx="201" cy="25" r="3" fill="white"/>
      <text x="195" y="45" font-family="Arial, sans-serif" font-size="7" fill="#166534" text-anchor="middle" font-weight="bold">Cloud</text>
      <text x="195" y="55" font-family="Arial, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">AWS, Azure</text>
    </g>

    <!-- Footer with Sliding Animation -->
    <rect x="12" y="175" width="276" height="18" rx="4" fill="#f1f5f9">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3s" fill="freeze"/>
    </rect>
    <text x="150" y="186" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3.2s" fill="freeze"/>
      Building Tomorrow's Digital Solutions Today
    </text>
  </g>

  <!-- Floating Tech Icons -->
  <g opacity="0.6">
    <circle cx="350" cy="60" r="15" fill="url(#webGradient)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-10; 0,0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="350" y="65" font-family="monospace" font-size="8" fill="white" text-anchor="middle">JS</text>

    <circle cx="30" cy="250" r="12" fill="url(#webGradient)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,8; 0,0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="254" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">CSS</text>
  </g>

  <!-- Performance Indicators -->
  <g transform="translate(320, 200)" opacity="0.8">
    <rect x="0" y="0" width="60" height="40" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="30" y="12" font-family="Arial, sans-serif" font-size="7" fill="#22c55e" text-anchor="middle">Performance</text>
    
    <!-- Speed Meter -->
    <circle cx="30" cy="25" r="8" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="30" cy="25" r="8" fill="none" stroke="#22c55e" stroke-width="2" 
            stroke-dasharray="0 50" transform="rotate(-90 30 25)">
      <animate attributeName="stroke-dasharray" values="0 50;35 15;0 50" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="5" fill="#22c55e" text-anchor="middle">98%</text>
  </g>
</svg>
