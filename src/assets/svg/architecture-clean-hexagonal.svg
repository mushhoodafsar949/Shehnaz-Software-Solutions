<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cleanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">Clean Architecture (Hexagonal)</text>
  
  <!-- Core Domain (Center) -->
  <g transform="translate(350, 250)">
    <circle cx="0" cy="0" r="60" fill="url(#cleanGradient)"/>
    <text x="0" y="-10" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Domain</text>
    <text x="0" y="5" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Entities</text>
    <text x="0" y="20" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Business Logic</text>
  </g>
  
  <!-- Application Layer -->
  <g transform="translate(350, 250)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="-85" font-family="Arial" font-size="12" fill="#166534" text-anchor="middle" font-weight="bold">Application Layer</text>
    <text x="0" y="-70" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Use Cases</text>
  </g>
  
  <!-- Infrastructure Layer -->
  <g transform="translate(350, 250)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="-135" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle" font-weight="bold">Infrastructure Layer</text>
  </g>
  
  <!-- Adapters -->
  <!-- Web Controller -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="#3b82f6"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Web Controller</text>
  </g>
  
  <!-- Database -->
  <g transform="translate(520, 350)">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="#ef4444"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Database</text>
  </g>
  
  <!-- External API -->
  <g transform="translate(200, 350)">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="#f59e0b"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">External API</text>
  </g>
  
  <!-- Message Queue -->
  <g transform="translate(520, 150)">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="#8b5cf6"/>
    <text x="40" y="25" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Message Queue</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="280" y1="170" x2="320" y2="200" stroke="#3b82f6" stroke-width="2"/>
  <line x1="520" y1="170" x2="480" y2="200" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="280" y1="370" x2="320" y2="340" stroke="#f59e0b" stroke-width="2"/>
  <line x1="520" y1="370" x2="480" y2="340" stroke="#ef4444" stroke-width="2"/>
  
  <!-- Ports -->
  <text x="250" y="130" font-family="Arial" font-size="10" fill="#64748b">Input Port</text>
  <text x="480" y="130" font-family="Arial" font-size="10" fill="#64748b">Output Port</text>
  <text x="250" y="410" font-family="Arial" font-size="10" fill="#64748b">Output Port</text>
  <text x="480" y="410" font-family="Arial" font-size="10" fill="#64748b">Output Port</text>
  
  <!-- Principles -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">Clean Architecture Principles:</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#64748b">• Dependency inversion</text>
    <text x="0" y="35" font-family="Arial" font-size="12" fill="#64748b">• Separation of concerns</text>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#64748b">• Testable architecture</text>
    <text x="300" y="20" font-family="Arial" font-size="12" fill="#64748b">• Framework independence</text>
    <text x="300" y="35" font-family="Arial" font-size="12" fill="#64748b">• Database independence</text>
    <text x="300" y="50" font-family="Arial" font-size="12" fill="#64748b">• UI independence</text>
  </g>
</svg>