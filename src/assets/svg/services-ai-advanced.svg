<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <radialGradient id="neuronGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc">
    <animate attributeName="fill" values="#f8fafc;#f1f5f9;#f8fafc" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating AI Particles -->
  <g opacity="0.4">
    <circle cx="50" cy="50" r="2" fill="#22c55e">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-8; 0,0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="70" r="1.5" fill="#4ade80">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,10; 0,0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <rect x="80" y="250" width="3" height="3" rx="1.5" fill="#166534">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <polygon points="320,220 325,230 315,230" fill="#22c55e">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Neural Network Center -->
  <g transform="translate(100, 60)">
    <!-- Input Layer -->
    <g>
      <circle cx="0" cy="20" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0.5s" fill="freeze"/>
      </circle>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">I1</text>
      
      <circle cx="0" cy="50" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="7;9;7" dur="3s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0.7s" fill="freeze"/>
      </circle>
      <text x="0" y="55" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">I2</text>
      
      <circle cx="0" cy="80" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="8;10;8" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0.9s" fill="freeze"/>
      </circle>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">I3</text>
      
      <circle cx="0" cy="110" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="6;9;6" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.1s" fill="freeze"/>
      </circle>
      <text x="0" y="115" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">I4</text>
    </g>

    <!-- Hidden Layer 1 -->
    <g transform="translate(60, 0)">
      <circle cx="0" cy="10" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="7;11;7" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.5s" fill="freeze"/>
      </circle>
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H1</text>
      
      <circle cx="0" cy="35" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="6;10;6" dur="4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.7s" fill="freeze"/>
      </circle>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H2</text>
      
      <circle cx="0" cy="60" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="8;12;8" dur="4s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.9s" fill="freeze"/>
      </circle>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H3</text>
      
      <circle cx="0" cy="85" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="7;9;7" dur="4s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.1s" fill="freeze"/>
      </circle>
      <text x="0" y="90" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H4</text>
      
      <circle cx="0" cy="110" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="6;10;6" dur="4s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.3s" fill="freeze"/>
      </circle>
      <text x="0" y="115" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H5</text>
      
      <circle cx="0" cy="135" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="8;11;8" dur="4s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.5s" fill="freeze"/>
      </circle>
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H6</text>
    </g>

    <!-- Hidden Layer 2 -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="20" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.5s" fill="freeze"/>
      </circle>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H7</text>
      
      <circle cx="0" cy="50" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="6;11;6" dur="3s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.7s" fill="freeze"/>
      </circle>
      <text x="0" y="55" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H8</text>
      
      <circle cx="0" cy="80" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="8;9;8" dur="3s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.9s" fill="freeze"/>
      </circle>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H9</text>
      
      <circle cx="0" cy="110" r="8" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="7;12;7" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3.1s" fill="freeze"/>
      </circle>
      <text x="0" y="115" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">H10</text>
    </g>

    <!-- Output Layer -->
    <g transform="translate(180, 0)">
      <circle cx="0" cy="40" r="10" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3.5s" fill="freeze"/>
      </circle>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="5" fill="white" text-anchor="middle" font-weight="bold">O1</text>
      
      <circle cx="0" cy="70" r="10" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="9;13;9" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3.7s" fill="freeze"/>
      </circle>
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="5" fill="white" text-anchor="middle" font-weight="bold">O2</text>
      
      <circle cx="0" cy="100" r="10" fill="url(#aiGradient)" filter="url(#glow)">
        <animate attributeName="r" values="7;12;7" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3.9s" fill="freeze"/>
      </circle>
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="5" fill="white" text-anchor="middle" font-weight="bold">O3</text>
    </g>

    <!-- Neural Connections with Signal Animation -->
    <g opacity="0.6">
      <!-- Input to Hidden Layer 1 -->
      <line x1="8" y1="20" x2="52" y2="10" stroke="#22c55e" stroke-width="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="8" y1="20" x2="52" y2="35" stroke="#22c55e" stroke-width="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="8" y1="50" x2="52" y2="60" stroke="#22c55e" stroke-width="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="8" y1="80" x2="52" y2="85" stroke="#22c55e" stroke-width="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="8" y1="110" x2="52" y2="110" stroke="#22c55e" stroke-width="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/>
      </line>

      <!-- Hidden Layer 1 to Hidden Layer 2 -->
      <line x1="68" y1="35" x2="112" y2="20" stroke="#22c55e" stroke-width="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
      </line>
      <line x1="68" y1="60" x2="112" y2="50" stroke="#22c55e" stroke-width="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="68" y1="85" x2="112" y2="80" stroke="#22c55e" stroke-width="1">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="1.4s" repeatCount="indefinite"/>
      </line>

      <!-- Hidden Layer 2 to Output -->
      <line x1="128" y1="50" x2="172" y2="70" stroke="#22c55e" stroke-width="2">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="1.8s" repeatCount="indefinite"/>
      </line>
      <line x1="128" y1="80" x2="172" y2="100" stroke="#22c55e" stroke-width="2">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="2s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Signal Pulses -->
    <g>
      <circle cx="0" cy="0" r="2" fill="#4ade80">
        <animateMotion dur="2s" repeatCount="indefinite" begin="2s" path="M 8,20 L 52,35 L 112,50 L 172,70"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2" fill="#4ade80">
        <animateMotion dur="2s" repeatCount="indefinite" begin="2.5s" path="M 8,80 L 52,85 L 112,80 L 172,100"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- AI Applications -->
  <g transform="translate(320, 80)">
    <!-- Computer Vision -->
    <rect x="0" y="0" width="40" height="30" rx="4" fill="#1e293b">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="4s" fill="freeze"/>
    </rect>
    <rect x="3" y="3" width="34" height="24" rx="2" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="18" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">Vision</text>
    
    <!-- Eye Icon -->
    <circle cx="20" cy="15" r="3" fill="white" opacity="0.8"/>
    <circle cx="20" cy="15" r="1" fill="#1e293b"/>

    <!-- NLP -->
    <rect x="0" y="40" width="40" height="30" rx="4" fill="#1e293b">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="4.3s" fill="freeze"/>
    </rect>
    <rect x="3" y="43" width="34" height="24" rx="2" fill="#3b82f6">
      <animate attributeName="fill" values="#3b82f6;#60a5fa;#3b82f6" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">NLP</text>

    <!-- Prediction -->
    <rect x="0" y="80" width="40" height="30" rx="4" fill="#1e293b">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="4.6s" fill="freeze"/>
    </rect>
    <rect x="3" y="83" width="34" height="24" rx="2" fill="#f59e0b">
      <animate attributeName="fill" values="#f59e0b;#fbbf24;#f59e0b" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="98" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">Predict</text>
    
    <!-- Chart Icon -->
    <polyline points="8,95 15,90 25,92 32,87" stroke="white" stroke-width="1" fill="none" opacity="0.8"/>
  </g>

  <!-- Data Input -->
  <g transform="translate(50, 80)">
    <rect x="0" y="40" width="30" height="20" rx="3" fill="#64748b">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="15" y="53" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">Data</text>
    
    <!-- Data Stream -->
    <g opacity="0.7">
      <rect x="35" y="45" width="8" height="2" rx="1" fill="#22c55e">
        <animate attributeName="width" values="0;8;0" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="35" y="48" width="8" height="2" rx="1" fill="#22c55e">
        <animate attributeName="width" values="0;8;0" dur="1s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="35" y="51" width="8" height="2" rx="1" fill="#22c55e">
        <animate attributeName="width" values="0;8;0" dur="1s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Performance Metrics -->
  <g transform="translate(20, 200)" opacity="0.8">
    <rect x="0" y="0" width="120" height="60" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="60" y="15" font-family="Arial, sans-serif" font-size="8" fill="#22c55e" text-anchor="middle" font-weight="bold">
      AI Performance
    </text>
    
    <!-- Accuracy -->
    <text x="10" y="28" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Accuracy</text>
    <rect x="45" y="24" width="60" height="4" rx="2" fill="#374151"/>
    <rect x="45" y="24" width="0" height="4" rx="2" fill="#22c55e">
      <animate attributeName="width" values="0;54;54" dur="2s" begin="5s" fill="freeze"/>
    </rect>
    <text x="110" y="27" font-family="Arial, sans-serif" font-size="6" fill="#22c55e">98%</text>
    
    <!-- Speed -->
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Speed</text>
    <rect x="45" y="36" width="60" height="4" rx="2" fill="#374151"/>
    <rect x="45" y="36" width="0" height="4" rx="2" fill="#22c55e">
      <animate attributeName="width" values="0;48;48" dur="2s" begin="5.5s" fill="freeze"/>
    </rect>
    <text x="110" y="39" font-family="Arial, sans-serif" font-size="6" fill="#22c55e">92%</text>
    
    <!-- Learning -->
    <text x="10" y="52" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Learning</text>
    <rect x="45" y="48" width="60" height="4" rx="2" fill="#374151"/>
    <rect x="45" y="48" width="0" height="4" rx="2" fill="#22c55e">
      <animate attributeName="width" values="0;36;50;58" dur="3s" begin="6s" fill="freeze"/>
    </rect>
    <text x="110" y="51" font-family="Arial, sans-serif" font-size="6" fill="#22c55e">95%</text>
  </g>

  <!-- Service Labels -->
  <g transform="translate(200, 250)" opacity="0.9">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#166534" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="6s" fill="freeze"/>
      AI & Machine Learning
    </text>
    <g transform="translate(0, 18)" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
      <text x="0" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="6.5s" fill="freeze"/>
        • Neural Networks • Computer Vision • Natural Language Processing • Predictive Analytics
      </text>
    </g>
  </g>

  <!-- Brain Waves Effect -->
  <g transform="translate(0, 20)" opacity="0.3">
    <path d="M 0 50 Q 50 30 100 50 T 200 50 T 300 50 T 400 50" stroke="#22c55e" stroke-width="1" fill="none">
      <animate attributeName="d" values="M 0 50 Q 50 30 100 50 T 200 50 T 300 50 T 400 50;M 0 50 Q 50 70 100 50 T 200 50 T 300 50 T 400 50;M 0 50 Q 50 30 100 50 T 200 50 T 300 50 T 400 50" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 80 Q 80 60 160 80 T 320 80 T 400 80" stroke="#4ade80" stroke-width="1" fill="none">
      <animate attributeName="d" values="M 0 80 Q 80 60 160 80 T 320 80 T 400 80;M 0 80 Q 80 100 160 80 T 320 80 T 400 80;M 0 80 Q 80 60 160 80 T 320 80 T 400 80" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
