<div class="consultation-dialog">
  <!-- Steps Progress -->
  <p-steps [model]="steps" [activeIndex]="currentStep" [readonly]="true"></p-steps>

  <form [formGroup]="consultationForm" (ngSubmit)="onSubmit()" class="consultation-form">
    <!-- Step 1: Project Type -->
    <div class="step-content" *ngIf="currentStep === 0">
      <h2>What type of project are you looking to build?</h2>
      <div class="form-field">
        <p-dropdown formControlName="projectType"
                   [options]="projectTypes"
                   placeholder="Select Project Type"
                   [showClear]="true"
                   styleClass="w-full"></p-dropdown>
      </div>
    </div>

    <!-- Step 2: Requirements -->
    <div class="step-content" *ngIf="currentStep === 1">
      <h2>Tell us about your project</h2>
      
      <div class="form-field">
        <span class="p-float-label">
          <textarea pInputTextarea formControlName="projectDescription"
                    [rows]="5" [autoResize]="true"></textarea>
          <label>Project Description</label>
        </span>
      </div>

      <div class="form-row">
        <div class="form-field">
          <p-dropdown formControlName="budget"
                     [options]="budgetRanges"
                     placeholder="Budget Range"
                     [showClear]="true"
                     styleClass="w-full"></p-dropdown>
        </div>

        <div class="form-field">
          <p-dropdown formControlName="timeline"
                     [options]="timelines"
                     placeholder="Project Timeline"
                     [showClear]="true"
                     styleClass="w-full"></p-dropdown>
        </div>
      </div>
    </div>

    <!-- Step 3: Contact Info -->
    <div class="step-content" *ngIf="currentStep === 2">
      <h2>Your Contact Information</h2>
      
      <div class="form-row">
        <div class="form-field">
          <span class="p-float-label">
            <input pInputText formControlName="name" type="text" />
            <label>Full Name</label>
          </span>
        </div>

        <div class="form-field">
          <span class="p-float-label">
            <input pInputText formControlName="email" type="email" />
            <label>Email Address</label>
          </span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <span class="p-float-label">
            <input pInputText formControlName="company" type="text" />
            <label>Company Name (Optional)</label>
          </span>
        </div>

        <div class="form-field">
          <span class="p-float-label">
            <input pInputText formControlName="phone" type="tel" />
            <label>Phone Number (Optional)</label>
          </span>
        </div>
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="dialog-footer">
      <button pButton pRipple type="button" 
              label="Cancel" 
              class="p-button-outlined"
              (click)="onCancel()"></button>

      <div class="step-buttons">
        <button *ngIf="currentStep > 0" 
                pButton pRipple type="button" 
                label="Previous" 
                icon="pi pi-arrow-left"
                class="p-button-secondary"
                (click)="previousStep()"></button>

        <button *ngIf="currentStep < 2" 
                pButton pRipple type="button" 
                label="Next" 
                icon="pi pi-arrow-right" 
                iconPos="right"
                (click)="nextStep()"></button>

        <button *ngIf="currentStep === 2" 
                pButton pRipple type="submit" 
                label="Submit" 
                icon="pi pi-check"
                [loading]="isSubmitting"
                [disabled]="!consultationForm.valid || isSubmitting"></button>
      </div>
    </div>
  </form>
</div>

<p-toast position="top-right"></p-toast>
