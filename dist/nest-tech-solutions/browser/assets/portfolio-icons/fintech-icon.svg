<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fintechGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <filter id="fintechGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="40" cy="40" r="38" fill="url(#fintechGradient)" filter="url(#fintechGlow)" opacity="0.9"/>
  
  <!-- Bank building icon -->
  <g transform="translate(40, 40)">
    <!-- Building base -->
    <rect x="-18" y="0" width="36" height="20" fill="#ffffff" opacity="0.9" rx="2"/>
    
    <!-- Columns -->
    <rect x="-15" y="-12" width="4" height="12" fill="#ffffff"/>
    <rect x="-8" y="-12" width="4" height="12" fill="#ffffff"/>
    <rect x="-1" y="-12" width="4" height="12" fill="#ffffff"/>
    <rect x="6" y="-12" width="4" height="12" fill="#ffffff"/>
    <rect x="13" y="-12" width="4" height="12" fill="#ffffff"/>
    
    <!-- Roof -->
    <polygon points="-20,-14 0,-20 20,-14" fill="#ffffff"/>
    
    <!-- Digital elements -->
    <circle cx="-22" cy="-8" r="2" fill="#ff6b35"/>
    <circle cx="22" cy="-8" r="2" fill="#ff6b35"/>
    <circle cx="-22" cy="8" r="2" fill="#ff6b35"/>
    <circle cx="22" cy="8" r="2" fill="#ff6b35"/>
    
    <!-- Connection lines -->
    <line x1="-22" y1="-8" x2="0" y2="0" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    <line x1="22" y1="-8" x2="0" y2="0" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    <line x1="-22" y1="8" x2="0" y2="0" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    <line x1="22" y1="8" x2="0" y2="0" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    
    <!-- Dollar sign -->
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">$</text>
  </g>
</svg>
