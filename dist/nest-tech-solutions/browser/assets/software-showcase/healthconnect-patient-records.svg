<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" rx="20"/>
  
  <!-- Patient Info Header -->
  <g transform="translate(40, 40)">
    <rect width="720" height="120" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <!-- Patient Avatar -->
    <circle cx="80" cy="60" r="30" fill="#6366f1"/>
    <text x="65" y="70" fill="white" font-family="Arial" font-size="24">JD</text>
    <!-- Patient Details -->
    <text x="140" y="50" fill="#1e293b" font-family="Arial" font-size="24" font-weight="bold">John Doe</text>
    <text x="140" y="80" fill="#64748b" font-family="Arial" font-size="16">ID: #12345 • Age: 45 • Blood Type: O+</text>
  </g>
  
  <!-- Medical History -->
  <g transform="translate(40, 180)">
    <rect width="460" height="380" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="20" font-weight="bold">Medical History</text>
    
    <!-- Timeline -->
    <g transform="translate(20, 70)">
      <!-- Entry 1 -->
      <circle cx="10" cy="20" r="6" fill="#6366f1"/>
      <line x1="10" y1="26" x2="10" y2="90" stroke="#e2e8f0" stroke-width="2"/>
      <text x="30" y="15" fill="#64748b" font-family="Arial" font-size="14">Aug 15, 2023</text>
      <text x="30" y="35" fill="#1e293b" font-family="Arial" font-size="16">Annual Check-up</text>
      <text x="30" y="55" fill="#64748b" font-family="Arial" font-size="14">All vitals normal. Recommended routine exercise.</text>
      
      <!-- Entry 2 -->
      <circle cx="10" cy="100" r="6" fill="#6366f1"/>
      <line x1="10" y1="106" x2="10" y2="170" stroke="#e2e8f0" stroke-width="2"/>
      <text x="30" y="95" fill="#64748b" font-family="Arial" font-size="14">Sep 22, 2023</text>
      <text x="30" y="115" fill="#1e293b" font-family="Arial" font-size="16">Vaccination</text>
      <text x="30" y="135" fill="#64748b" font-family="Arial" font-size="14">Flu shot administered. No adverse reactions.</text>
      
      <!-- Entry 3 -->
      <circle cx="10" cy="180" r="6" fill="#6366f1"/>
      <text x="30" y="175" fill="#64748b" font-family="Arial" font-size="14">Oct 10, 2023</text>
      <text x="30" y="195" fill="#1e293b" font-family="Arial" font-size="16">Blood Work</text>
      <text x="30" y="215" fill="#64748b" font-family="Arial" font-size="14">Cholesterol levels slightly elevated.</text>
    </g>
  </g>
  
  <!-- Vitals Monitor -->
  <g transform="translate(520, 180)">
    <rect width="240" height="380" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="20" y="40" fill="#1e293b" font-family="Arial" font-size="20" font-weight="bold">Current Vitals</text>
    
    <!-- Heart Rate -->
    <g transform="translate(20, 70)">
      <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="16">Heart Rate</text>
      <text x="180" y="20" fill="#1e293b" font-family="Arial" font-size="16" font-weight="bold">72 bpm</text>
      <rect x="0" y="30" width="200" height="6" fill="#f1f5f9" rx="3"/>
      <rect x="0" y="30" width="144" height="6" fill="#6366f1" rx="3"/>
    </g>
    
    <!-- Blood Pressure -->
    <g transform="translate(20, 120)">
      <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="16">Blood Pressure</text>
      <text x="160" y="20" fill="#1e293b" font-family="Arial" font-size="16" font-weight="bold">120/80</text>
      <rect x="0" y="30" width="200" height="6" fill="#f1f5f9" rx="3"/>
      <rect x="0" y="30" width="160" height="6" fill="#6366f1" rx="3"/>
    </g>
    
    <!-- Temperature -->
    <g transform="translate(20, 170)">
      <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="16">Temperature</text>
      <text x="160" y="20" fill="#1e293b" font-family="Arial" font-size="16" font-weight="bold">98.6°F</text>
      <rect x="0" y="30" width="200" height="6" fill="#f1f5f9" rx="3"/>
      <rect x="0" y="30" width="180" height="6" fill="#6366f1" rx="3"/>
    </g>
  </g>
</svg>
