<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#03a9f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:1" />
    </linearGradient>
    <filter id="cloudGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="48" fill="url(#cloudGradient)" filter="url(#cloudGlow)" opacity="0.95"/>
  
  <g transform="translate(50, 50)">
    <!-- Main cloud -->
    <path d="M -20,-8 Q -25,-15 -15,-15 Q -10,-20 0,-15 Q 10,-20 15,-15 Q 25,-15 20,-8 Q 25,-5 20,2 L -20,2 Q -25,-5 -20,-8 Z" 
          fill="#ffffff" opacity="0.95"/>
    
    <!-- Cloud infrastructure icons -->
    <g transform="translate(0, -3)">
      <!-- Server racks -->
      <rect x="-8" y="-3" width="4" height="6" rx="1" fill="url(#cloudGradient)" opacity="0.8"/>
      <rect x="-2" y="-3" width="4" height="6" rx="1" fill="url(#cloudGradient)" opacity="0.8"/>
      <rect x="4" y="-3" width="4" height="6" rx="1" fill="url(#cloudGradient)" opacity="0.8"/>
      
      <!-- Server indicators -->
      <circle cx="-6" cy="-1" r="0.5" fill="#4caf50"/>
      <circle cx="-6" cy="0" r="0.5" fill="#4caf50"/>
      <circle cx="0" cy="-1" r="0.5" fill="#4caf50"/>
      <circle cx="0" cy="0" r="0.5" fill="#4caf50"/>
      <circle cx="6" cy="-1" r="0.5" fill="#4caf50"/>
      <circle cx="6" cy="0" r="0.5" fill="#4caf50"/>
    </g>
    
    <!-- Docker containers -->
    <g transform="translate(-25, 8)" opacity="0.8">
      <rect x="0" y="0" width="8" height="6" rx="1" fill="#2496ed"/>
      <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="3" fill="#ffffff">Docker</text>
    </g>
    
    <!-- Kubernetes -->
    <g transform="translate(17, 8)" opacity="0.8">
      <circle cx="4" cy="3" r="4" fill="#326ce5"/>
      <text x="4" y="4.5" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">K8s</text>
    </g>
    
    <!-- CI/CD Pipeline -->
    <g transform="translate(0, 20)">
      <rect x="-15" y="0" width="30" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
      <text x="0" y="2.5" text-anchor="middle" font-family="Arial" font-size="3" fill="url(#cloudGradient)">CI/CD Pipeline</text>
      
      <!-- Pipeline stages -->
      <circle cx="-12" cy="2" r="1" fill="#4caf50"/>
      <circle cx="-4" cy="2" r="1" fill="#4caf50"/>
      <circle cx="4" cy="2" r="1" fill="#4caf50"/>
      <circle cx="12" cy="2" r="1" fill="#4caf50"/>
      
      <!-- Arrows between stages -->
      <path d="M -10,2 L -6,2" stroke="url(#cloudGradient)" stroke-width="1" marker-end="url(#arrowhead)"/>
      <path d="M -2,2 L 2,2" stroke="url(#cloudGradient)" stroke-width="1" marker-end="url(#arrowhead)"/>
      <path d="M 6,2 L 10,2" stroke="url(#cloudGradient)" stroke-width="1" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- Cloud providers -->
    <g transform="translate(-30, -25)" opacity="0.7">
      <!-- AWS -->
      <rect x="0" y="0" width="8" height="6" rx="1" fill="#ff9900"/>
      <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">AWS</text>
    </g>
    
    <g transform="translate(-10, -30)" opacity="0.7">
      <!-- Azure -->
      <rect x="0" y="0" width="8" height="6" rx="1" fill="#0078d4"/>
      <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">Azure</text>
    </g>
    
    <g transform="translate(12, -25)" opacity="0.7">
      <!-- Google Cloud -->
      <rect x="0" y="0" width="8" height="6" rx="1" fill="#4285f4"/>
      <text x="4" y="4" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">GCP</text>
    </g>
    
    <!-- Monitoring and automation -->
    <g transform="translate(25, -5)" opacity="0.8">
      <circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.9"/>
      <path d="M -2,-2 L 0,0 L 2,-2 M 0,0 L 0,2" stroke="url(#cloudGradient)" stroke-width="1.5" fill="none"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Monitor</text>
    </g>
    
    <!-- Data flow lines -->
    <line x1="-20" y1="-5" x2="-15" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="-5" x2="15" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="5" x2="0" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Arrow marker for pipeline -->
  <defs>
    <marker id="arrowhead" markerWidth="3" markerHeight="2" refX="3" refY="1" orient="auto">
      <polygon points="0 0, 3 1, 0 2" fill="url(#cloudGradient)"/>
    </marker>
  </defs>
</svg>

