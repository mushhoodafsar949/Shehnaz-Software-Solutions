<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="designGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e91e63;stop-opacity:1" />
    </linearGradient>
    <filter id="designGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="48" fill="url(#designGradient)" filter="url(#designGlow)" opacity="0.95"/>
  
  <g transform="translate(50, 50)">
    <!-- Design canvas/artboard -->
    <rect x="-20" y="-25" width="40" height="35" rx="4" fill="#ffffff" opacity="0.95"/>
    
    <!-- Grid guidelines -->
    <g opacity="0.3">
      <line x1="-15" y1="-20" x2="-15" y2="5" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="-5" y1="-20" x2="-5" y2="5" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="5" y1="-20" x2="5" y2="5" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="15" y1="-20" x2="15" y2="5" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="-20" y1="-15" x2="20" y2="-15" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#e0e0e0" stroke-width="0.5"/>
    </g>
    
    <!-- UI Elements being designed -->
    <rect x="-15" y="-20" width="30" height="4" rx="2" fill="url(#designGradient)" opacity="0.8"/>
    <rect x="-15" y="-14" width="20" height="3" rx="1.5" fill="#e0e0e0"/>
    <rect x="-15" y="-9" width="25" height="2" rx="1" fill="#e0e0e0"/>
    <rect x="-15" y="-6" width="18" height="2" rx="1" fill="#e0e0e0"/>
    
    <!-- Button designs -->
    <rect x="-10" y="-1" width="8" height="3" rx="1.5" fill="url(#designGradient)" opacity="0.8"/>
    <rect x="2" y="-1" width="8" height="3" rx="1.5" fill="#4caf50" opacity="0.8"/>
    
    <!-- Design tools -->
    <g transform="translate(-35, -20)" opacity="0.8">
      <!-- Pen tool -->
      <path d="M 0,0 L 2,6 L 4,0 L 2,-2 Z" fill="#ffffff"/>
      <circle cx="2" cy="8" r="1" fill="url(#designGradient)"/>
      <text x="2" y="14" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Pen</text>
    </g>
    
    <g transform="translate(31, -20)" opacity="0.8">
      <!-- Color palette -->
      <rect x="0" y="0" width="6" height="6" rx="1" fill="#ffffff"/>
      <circle cx="1.5" cy="1.5" r="1" fill="#ff5722"/>
      <circle cx="4.5" cy="1.5" r="1" fill="#2196f3"/>
      <circle cx="1.5" cy="4.5" r="1" fill="#4caf50"/>
      <circle cx="4.5" cy="4.5" r="1" fill="#ff9800"/>
      <text x="3" y="12" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Colors</text>
    </g>
    
    <!-- Typography showcase -->
    <g transform="translate(-30, 5)" opacity="0.8">
      <rect x="0" y="0" width="12" height="8" rx="2" fill="#ffffff"/>
      <text x="6" y="3" text-anchor="middle" font-family="Arial" font-size="2" fill="url(#designGradient)">Aa</text>
      <text x="6" y="6" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#666">Typography</text>
      <text x="6" y="12" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Fonts</text>
    </g>
    
    <!-- Prototype/Wireframe -->
    <g transform="translate(18, 5)" opacity="0.8">
      <rect x="0" y="0" width="8" height="12" rx="2" fill="#ffffff"/>
      <rect x="1" y="1" width="6" height="2" fill="#e0e0e0"/>
      <rect x="1" y="4" width="4" height="1" fill="#e0e0e0"/>
      <rect x="1" y="6" width="5" height="1" fill="#e0e0e0"/>
      <rect x="1" y="8" width="3" height="1" fill="#e0e0e0"/>
      <circle cx="6" cy="10" r="0.5" fill="url(#designGradient)"/>
      <text x="4" y="17" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Wireframe</text>
    </g>
    
    <!-- User flow indicators -->
    <g transform="translate(0, 20)" opacity="0.8">
      <circle cx="-12" cy="0" r="3" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <circle cx="12" cy="0" r="3" fill="#ffffff"/>
      
      <text x="-12" y="1" text-anchor="middle" font-family="Arial" font-size="2" fill="url(#designGradient)">1</text>
      <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="2" fill="url(#designGradient)">2</text>
      <text x="12" y="1" text-anchor="middle" font-family="Arial" font-size="2" fill="url(#designGradient)">3</text>
      
      <path d="M -8,0 L -4,0" stroke="#ffffff" stroke-width="1.5" marker-end="url(#designArrow)"/>
      <path d="M 4,0 L 8,0" stroke="#ffffff" stroke-width="1.5" marker-end="url(#designArrow)"/>
      
      <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">User Flow</text>
    </g>
    
    <!-- Design principles -->
    <g transform="translate(-40, -5)" opacity="0.7">
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
      <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="2" fill="url(#designGradient)">UX</text>
      <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Research</text>
    </g>
    
    <g transform="translate(40, -5)" opacity="0.7">
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
      <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="2" fill="url(#designGradient)">UI</text>
      <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Interface</text>
    </g>
    
    <!-- Responsive design indicators -->
    <g transform="translate(0, -40)" opacity="0.7">
      <!-- Desktop -->
      <rect x="-6" y="0" width="12" height="8" rx="1" fill="#ffffff"/>
      <rect x="-5" y="1" width="10" height="5" fill="#f0f0f0"/>
      
      <!-- Mobile -->
      <rect x="10" y="2" width="4" height="7" rx="1" fill="#ffffff"/>
      <rect x="10.5" y="2.5" width="3" height="5" fill="#f0f0f0"/>
      
      <!-- Tablet -->
      <rect x="-18" y="1" width="8" height="6" rx="1" fill="#ffffff"/>
      <rect x="-17" y="2" width="6" height="4" fill="#f0f0f0"/>
      
      <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Responsive</text>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="designArrow" markerWidth="4" markerHeight="3" refX="4" refY="1.5" orient="auto">
      <polygon points="0 0, 4 1.5, 0 3" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

