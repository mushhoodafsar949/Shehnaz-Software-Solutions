<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#673ab7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3f51b5;stop-opacity:1" />
    </linearGradient>
    <filter id="apiGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="48" fill="url(#apiGradient)" filter="url(#apiGlow)" opacity="0.95"/>
  
  <g transform="translate(50, 50)">
    <!-- Central API hub -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial" font-size="5" font-weight="bold" fill="url(#apiGradient)">API</text>
    
    <!-- REST endpoints -->
    <g transform="translate(-25, -20)" opacity="0.8">
      <rect x="0" y="0" width="12" height="6" rx="2" fill="#4caf50"/>
      <text x="6" y="3.5" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">GET</text>
    </g>
    
    <g transform="translate(13, -20)" opacity="0.8">
      <rect x="0" y="0" width="12" height="6" rx="2" fill="#2196f3"/>
      <text x="6" y="3.5" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">POST</text>
    </g>
    
    <g transform="translate(-25, 14)" opacity="0.8">
      <rect x="0" y="0" width="12" height="6" rx="2" fill="#ff9800"/>
      <text x="6" y="3.5" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">PUT</text>
    </g>
    
    <g transform="translate(13, 14)" opacity="0.8">
      <rect x="0" y="0" width="12" height="6" rx="2" fill="#f44336"/>
      <text x="6" y="3.5" text-anchor="middle" font-family="Arial" font-size="2.5" fill="#ffffff">DELETE</text>
    </g>
    
    <!-- Connection lines to API hub -->
    <line x1="-13" y1="-17" x2="-8" y2="-8" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="13" y1="-17" x2="8" y2="-8" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="-13" y1="17" x2="-8" y2="8" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="13" y1="17" x2="8" y2="8" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    
    <!-- JSON data representation -->
    <g transform="translate(-35, 0)" opacity="0.8">
      <rect x="0" y="-8" width="8" height="16" rx="2" fill="#ffffff"/>
      <text x="4" y="-4" text-anchor="middle" font-family="Monaco, monospace" font-size="2" fill="url(#apiGradient)">{</text>
      <text x="4" y="-1" text-anchor="middle" font-family="Monaco, monospace" font-size="1.5" fill="#666">"key"</text>
      <text x="4" y="2" text-anchor="middle" font-family="Monaco, monospace" font-size="1.5" fill="#666">"value"</text>
      <text x="4" y="5" text-anchor="middle" font-family="Monaco, monospace" font-size="2" fill="url(#apiGradient)">}</text>
      <text x="4" y="12" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">JSON</text>
    </g>
    
    <!-- XML data representation -->
    <g transform="translate(27, 0)" opacity="0.8">
      <rect x="0" y="-8" width="8" height="16" rx="2" fill="#ffffff"/>
      <text x="4" y="-4" text-anchor="middle" font-family="Monaco, monospace" font-size="1.5" fill="url(#apiGradient)">&lt;xml&gt;</text>
      <text x="4" y="-1" text-anchor="middle" font-family="Monaco, monospace" font-size="1" fill="#666">data</text>
      <text x="4" y="2" text-anchor="middle" font-family="Monaco, monospace" font-size="1.5" fill="url(#apiGradient)">&lt;/xml&gt;</text>
      <text x="4" y="12" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">XML</text>
    </g>
    
    <!-- Database connection -->
    <g transform="translate(0, 30)" opacity="0.8">
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="#ffffff"/>
      <ellipse cx="0" cy="-2" rx="8" ry="3" fill="#ffffff"/>
      <rect x="-8" y="-2" width="16" height="4" fill="#ffffff"/>
      <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Database</text>
    </g>
    
    <!-- Authentication -->
    <g transform="translate(0, -35)" opacity="0.8">
      <rect x="-6" y="-3" width="12" height="6" rx="2" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2" fill="none" stroke="url(#apiGradient)" stroke-width="1"/>
      <path d="M -1,-1 L 1,1 M -1,1 L 1,-1" stroke="url(#apiGradient)" stroke-width="1"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="2" fill="#ffffff">Auth</text>
    </g>
    
    <!-- Rate limiting -->
    <g transform="translate(-40, -25)" opacity="0.7">
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <path d="M -2,-2 L 2,2 M -2,2 L 2,-2" stroke="url(#apiGradient)" stroke-width="1"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#ffffff">Rate Limit</text>
    </g>
    
    <!-- API versioning -->
    <g transform="translate(40, -25)" opacity="0.7">
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <text x="0" y="1" text-anchor="middle" font-family="Arial" font-size="2" fill="url(#apiGradient)">v2</text>
      <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#ffffff">Version</text>
    </g>
    
    <!-- Microservices -->
    <g transform="translate(-40, 25)" opacity="0.7">
      <rect x="-2" y="-2" width="4" height="4" rx="1" fill="#ffffff"/>
      <rect x="-2" y="2" width="4" height="4" rx="1" fill="#ffffff"/>
      <rect x="2" y="-2" width="4" height="4" rx="1" fill="#ffffff"/>
      <text x="2" y="10" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#ffffff">Services</text>
    </g>
    
    <!-- GraphQL -->
    <g transform="translate(40, 25)" opacity="0.7">
      <polygon points="0,-3 2.6,1.5 -2.6,1.5" fill="#e10098"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="1.5" fill="#ffffff">GraphQL</text>
    </g>
    
    <!-- Data flow arrows -->
    <line x1="-35" y1="0" x2="-15" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.6" marker-end="url(#apiArrow)"/>
    <line x1="15" y1="0" x2="27" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.6" marker-end="url(#apiArrow)"/>
    <line x1="0" y1="15" x2="0" y2="25" stroke="#ffffff" stroke-width="2" opacity="0.6" marker-end="url(#apiArrow)"/>
    <line x1="0" y1="-15" x2="0" y2="-25" stroke="#ffffff" stroke-width="2" opacity="0.6" marker-end="url(#apiArrow)"/>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="apiArrow" markerWidth="4" markerHeight="3" refX="4" refY="1.5" orient="auto">
      <polygon points="0 0, 4 1.5, 0 3" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

