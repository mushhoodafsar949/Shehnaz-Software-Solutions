<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="mobileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" fill="#166534" text-anchor="middle" font-weight="bold">Mobile Development</text>
  
  <!-- Phone -->
  <g transform="translate(150, 60)">
    <rect x="0" y="0" width="100" height="180" rx="15" fill="#1e293b"/>
    <rect x="5" y="20" width="90" height="140" rx="5" fill="white"/>
    
    <!-- Home Button -->
    <circle cx="50" cy="170" r="8" fill="#64748b"/>
    
    <!-- Screen Content -->
    <rect x="10" y="25" width="80" height="30" rx="3" fill="url(#mobileGradient)"/>
    <text x="50" y="43" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Nest Tech</text>
    
    <!-- App Icons -->
    <rect x="15" y="65" width="20" height="20" rx="3" fill="#3b82f6"/>
    <rect x="40" y="65" width="20" height="20" rx="3" fill="#ef4444"/>
    <rect x="65" y="65" width="20" height="20" rx="3" fill="#10b981"/>
    
    <rect x="15" y="90" width="20" height="20" rx="3" fill="#f59e0b"/>
    <rect x="40" y="90" width="20" height="20" rx="3" fill="#8b5cf6"/>
    <rect x="65" y="90" width="20" height="20" rx="3" fill="#f97316"/>
    
    <!-- Bottom Navigation -->
    <rect x="10" y="125" width="80" height="30" rx="3" fill="#f1f5f9"/>
    <circle cx="25" cy="140" r="6" fill="url(#mobileGradient)"/>
    <circle cx="50" cy="140" r="6" fill="#cbd5e1"/>
    <circle cx="75" cy="140" r="6" fill="#cbd5e1"/>
  </g>
  
  <!-- Tablet -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="80" height="120" rx="8" fill="#1e293b"/>
    <rect x="5" y="10" width="70" height="100" rx="4" fill="white"/>
    
    <!-- Screen Content -->
    <rect x="10" y="15" width="60" height="20" rx="2" fill="url(#mobileGradient)"/>
    <text x="40" y="27" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Dashboard</text>
    
    <!-- Content Grid -->
    <rect x="12" y="40" width="25" height="25" rx="2" fill="#e2e8f0"/>
    <rect x="43" y="40" width="25" height="25" rx="2" fill="#e2e8f0"/>
    <rect x="12" y="70" width="25" height="25" rx="2" fill="#e2e8f0"/>
    <rect x="43" y="70" width="25" height="25" rx="2" fill="#e2e8f0"/>
  </g>
  
  <!-- Smart Watch -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="40" height="50" rx="8" fill="#1e293b"/>
    <rect x="3" y="5" width="34" height="40" rx="4" fill="black"/>
    
    <!-- Watch Face -->
    <circle cx="20" cy="25" r="12" fill="url(#mobileGradient)"/>
    <text x="20" y="29" font-family="Arial" font-size="6" fill="white" text-anchor="middle">12:30</text>
  </g>
  
  <!-- Features -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#166534" font-weight="bold">Features:</text>
    <text x="0" y="15" font-family="Arial" font-size="10" fill="#64748b">• Cross-platform development</text>
    <text x="0" y="28" font-family="Arial" font-size="10" fill="#64748b">• Native performance</text>
    <text x="0" y="41" font-family="Arial" font-size="10" fill="#64748b">• App store deployment</text>
    <text x="200" y="15" font-family="Arial" font-size="10" fill="#64748b">• Push notifications</text>
    <text x="200" y="28" font-family="Arial" font-size="10" fill="#64748b">• Offline functionality</text>
    <text x="200" y="41" font-family="Arial" font-size="10" fill="#64748b">• Analytics integration</text>
  </g>
</svg>