<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.1">
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
      </path>
    </pattern>
  </defs>

  <!-- Animated Background Grid -->
  <rect width="800" height="600" fill="url(#grid)"/>
  
  <!-- Floating Particles -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="3" fill="#22c55e">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-10; 0,0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="2" fill="#4ade80">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,15; 0,0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="500" r="4" fill="#166534">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,20; 0,0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Workstation Setup -->
  <g transform="translate(250, 180)">
    <!-- Desk -->
    <rect x="0" y="180" width="300" height="15" rx="7" fill="#8b5cf6" opacity="0.8"/>
    
    <!-- Monitor Stand -->
    <rect x="140" y="160" width="20" height="25" rx="2" fill="#64748b"/>
    <rect x="120" y="180" width="60" height="8" rx="4" fill="#64748b"/>
    
    <!-- Monitor Frame -->
    <rect x="50" y="20" width="200" height="140" rx="12" fill="#1e293b"/>
    <rect x="58" y="28" width="184" height="124" rx="8" fill="url(#screenGradient)"/>
    
    <!-- Screen Glow Effect -->
    <rect x="58" y="28" width="184" height="124" rx="8" fill="url(#glowEffect)" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Terminal Header -->
    <rect x="66" y="36" width="168" height="20" rx="4" fill="url(#primaryGradient)"/>
    <circle cx="76" cy="46" r="3" fill="#ef4444"/>
    <circle cx="88" cy="46" r="3" fill="#f59e0b"/>
    <circle cx="100" cy="46" r="3" fill="#10b981"/>
    <text x="150" y="49" font-family="monospace" font-size="10" fill="white" text-anchor="middle">nest-tech-solutions.dev</text>
    
    <!-- Animated Code Lines -->
    <g font-family="monospace" font-size="9">
      <text x="72" y="72" fill="#22c55e">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0s" fill="freeze"/>
        const solutions = {
      </text>
      <text x="76" y="86" fill="#22c55e">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0.5s" fill="freeze"/>
        web: 'React, Angular, Vue',
      </text>
      <text x="76" y="100" fill="#22c55e">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1s" fill="freeze"/>
        mobile: 'React Native, Flutter',
      </text>
      <text x="76" y="114" fill="#22c55e">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.5s" fill="freeze"/>
        cloud: 'AWS, Azure, GCP',
      </text>
      <text x="76" y="128" fill="#22c55e">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2s" fill="freeze"/>
        ai: 'Machine Learning, NLP'
      </text>
      <text x="72" y="142" fill="#22c55e">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.5s" fill="freeze"/>
        };
      </text>
    </g>
    
    <!-- Cursor Blink -->
    <rect x="106" y="135" width="2" height="12" fill="#22c55e">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="3s"/>
    </rect>
  </g>

  <!-- Floating Tech Orbs with Advanced Animations -->
  <!-- React Orb -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="30" fill="url(#primaryGradient)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="r" values="28;32;28" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="20" fill="none" stroke="white" stroke-width="2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="15s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">React</text>
    
    <!-- Orbital Particles -->
    <g>
      <circle cx="25" cy="0" r="2" fill="#4ade80">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-25" cy="0" r="2" fill="#4ade80">
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Angular Orb -->
  <g transform="translate(650, 180)">
    <circle cx="0" cy="0" r="30" fill="url(#primaryGradient)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="r" values="30;26;30" dur="5s" repeatCount="indefinite"/>
    </circle>
    <polygon points="0,-15 13,10 -13,10" fill="white" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
    </polygon>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Angular</text>
  </g>

  <!-- Node.js Orb -->
  <g transform="translate(200, 420)">
    <circle cx="0" cy="0" r="30" fill="url(#primaryGradient)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="r" values="29;33;29" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="white" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Node.js</text>
  </g>

  <!-- Cloud/AWS Orb -->
  <g transform="translate(600, 420)">
    <circle cx="0" cy="0" r="30" fill="url(#primaryGradient)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="r" values="28;34;28" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- Cloud Shape -->
    <ellipse cx="0" cy="-2" rx="12" ry="6" fill="white" opacity="0.9"/>
    <circle cx="-8" cy="-2" r="4" fill="white" opacity="0.9"/>
    <circle cx="8" cy="-2" r="4" fill="white" opacity="0.9"/>
    <circle cx="-4" cy="-8" r="3" fill="white" opacity="0.9"/>
    <circle cx="4" cy="-8" r="3" fill="white" opacity="0.9"/>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Cloud</text>
  </g>

  <!-- Data Flow Connections with Animation -->
  <g opacity="0.7">
    <path d="M 180 180 Q 300 150 620 210" stroke="url(#primaryGradient)" stroke-width="2" fill="none">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 620 210 Q 500 350 230 450" stroke="url(#primaryGradient)" stroke-width="2" fill="none">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 230 450 Q 400 400 570 450" stroke="url(#primaryGradient)" stroke-width="2" fill="none">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Data Packets Animation -->
  <g>
    <circle cx="0" cy="0" r="3" fill="#4ade80">
      <animateMotion dur="4s" repeatCount="indefinite" path="M 180,180 Q 300,150 620,210"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#4ade80">
      <animateMotion dur="4s" repeatCount="indefinite" begin="1s" path="M 620,210 Q 500,350 230,450"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#4ade80">
      <animateMotion dur="4s" repeatCount="indefinite" begin="2s" path="M 230,450 Q 400,400 570,450"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Performance Metrics HUD -->
  <g transform="translate(50, 50)" opacity="0.8">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="60" y="15" font-family="Arial, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle" font-weight="bold">System Status</text>
    
    <!-- CPU Usage Bar -->
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e1">CPU</text>
    <rect x="30" y="25" width="70" height="6" rx="3" fill="#374151"/>
    <rect x="30" y="25" width="0" height="6" rx="3" fill="#22c55e">
      <animate attributeName="width" values="0;45;60;35;50" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Memory Usage Bar -->
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e1">RAM</text>
    <rect x="30" y="40" width="70" height="6" rx="3" fill="#374151"/>
    <rect x="30" y="40" width="0" height="6" rx="3" fill="#22c55e">
      <animate attributeName="width" values="0;30;40;25;35" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Network Activity -->
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e1">NET</text>
    <rect x="30" y="55" width="70" height="6" rx="3" fill="#374151"/>
    <rect x="30" y="55" width="0" height="6" rx="3" fill="#22c55e">
      <animate attributeName="width" values="0;20;55;10;40" dur="2s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Status Indicator -->
    <circle cx="105" cy="70" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="85" y="73" font-family="Arial, sans-serif" font-size="7" fill="#10b981">ONLINE</text>
  </g>
</svg>
