<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="24" fill="#166534" text-anchor="middle" font-weight="bold">Digital Solutions</text>
  
  <!-- Main Laptop -->
  <g transform="translate(200, 150)">
    <!-- Laptop Base -->
    <rect x="0" y="200" width="400" height="20" rx="10" fill="#1e293b"/>
    
    <!-- Laptop Screen -->
    <rect x="50" y="0" width="300" height="200" rx="8" fill="#0f172a"/>
    <rect x="60" y="10" width="280" height="180" rx="4" fill="#1e293b"/>
    
    <!-- Screen Content -->
    <rect x="70" y="20" width="260" height="25" rx="2" fill="url(#primaryGradient)"/>
    <text x="200" y="37" font-family="monospace" font-size="12" fill="white" text-anchor="middle">nest-tech-solutions.tsx</text>
    
    <!-- Code Lines -->
    <text x="80" y="65" font-family="monospace" font-size="10" fill="#22c55e">import React from 'react';</text>
    <text x="80" y="80" font-family="monospace" font-size="10" fill="#22c55e">const NestTech = () => {</text>
    <text x="90" y="95" font-family="monospace" font-size="10" fill="#22c55e">return (</text>
    <text x="100" y="110" font-family="monospace" font-size="10" fill="#f87171">&lt;div className="hero"&gt;</text>
    <text x="110" y="125" font-family="monospace" font-size="10" fill="#f87171">&lt;h1&gt;Digital Solutions&lt;/h1&gt;</text>
    <text x="100" y="140" font-family="monospace" font-size="10" fill="#f87171">&lt;/div&gt;</text>
    <text x="90" y="155" font-family="monospace" font-size="10" fill="#22c55e">);</text>
    <text x="80" y="170" font-family="monospace" font-size="10" fill="#22c55e">};</text>
  </g>
  
  <!-- Tech Icons -->
  <circle cx="100" cy="300" r="25" fill="url(#primaryGradient)"/>
  <text x="100" y="308" font-family="Arial" font-size="14" fill="white" text-anchor="middle">JS</text>
  
  <circle cx="700" cy="320" r="25" fill="url(#primaryGradient)"/>
  <text x="700" y="328" font-family="Arial" font-size="12" fill="white" text-anchor="middle">React</text>
  
  <circle cx="150" cy="450" r="25" fill="url(#primaryGradient)"/>
  <text x="150" y="458" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Node</text>
  
  <circle cx="650" cy="480" r="25" fill="url(#primaryGradient)"/>
  <text x="650" y="488" font-family="Arial" font-size="14" fill="white" text-anchor="middle">DB</text>
