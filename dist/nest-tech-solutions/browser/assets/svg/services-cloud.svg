<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#166534" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" fill="#166534" text-anchor="middle" font-weight="bold">Cloud &amp; DevOps</text>
  
  <!-- Cloud Shape -->
  <g transform="translate(150, 70)">
    <ellipse cx="50" cy="40" rx="60" ry="25" fill="url(#cloudGradient)"/>
    <circle cx="20" cy="40" r="20" fill="url(#cloudGradient)"/>
    <circle cx="80" cy="40" r="20" fill="url(#cloudGradient)"/>
    <circle cx="35" cy="25" r="15" fill="url(#cloudGradient)"/>
    <circle cx="65" cy="25" r="15" fill="url(#cloudGradient)"/>
    
    <!-- Cloud Services -->
    <text x="50" y="45" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">AWS</text>
  </g>
  
  <!-- Servers -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#1e293b"/>
    <rect x="2" y="5" width="26" height="8" rx="1" fill="#22c55e"/>
    <rect x="2" y="16" width="26" height="8" rx="1" fill="#22c55e"/>
    <rect x="2" y="27" width="26" height="8" rx="1" fill="#64748b"/>
    
    <rect x="40" y="0" width="30" height="40" rx="3" fill="#1e293b"/>
    <rect x="42" y="5" width="26" height="8" rx="1" fill="#22c55e"/>
    <rect x="42" y="16" width="26" height="8" rx="1" fill="#64748b"/>
    <rect x="42" y="27" width="26" height="8" rx="1" fill="#22c55e"/>
    
    <rect x="80" y="0" width="30" height="40" rx="3" fill="#1e293b"/>
    <rect x="82" y="5" width="26" height="8" rx="1" fill="#64748b"/>
    <rect x="82" y="16" width="26" height="8" rx="1" fill="#22c55e"/>
    <rect x="82" y="27" width="26" height="8" rx="1" fill="#22c55e"/>
  </g>
  
  <!-- Docker Containers -->
  <g transform="translate(280, 140)">
    <rect x="0" y="0" width="25" height="25" rx="3" fill="#2563eb"/>
    <text x="12.5" y="16" font-family="Arial" font-size="8" fill="white" text-anchor="middle">App</text>
    
    <rect x="30" y="0" width="25" height="25" rx="3" fill="#2563eb"/>
    <text x="42.5" y="16" font-family="Arial" font-size="8" fill="white" text-anchor="middle">DB</text>
    
    <rect x="60" y="0" width="25" height="25" rx="3" fill="#2563eb"/>
    <text x="72.5" y="16" font-family="Arial" font-size="8" fill="white" text-anchor="middle">API</text>
    
    <rect x="15" y="30" width="25" height="25" rx="3" fill="#2563eb"/>
    <text x="27.5" y="46" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Web</text>
    
    <rect x="45" y="30" width="25" height="25" rx="3" fill="#2563eb"/>
    <text x="57.5" y="46" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Cache</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="200" y1="120" x2="95" y2="150" stroke="#22c55e" stroke-width="2"/>
  <line x1="200" y1="120" x2="320" y2="140" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Services -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#166534" font-weight="bold">Services:</text>
    <text x="0" y="15" font-family="Arial" font-size="10" fill="#64748b">• Cloud migration</text>
    <text x="0" y="28" font-family="Arial" font-size="10" fill="#64748b">• CI/CD pipelines</text>
    <text x="0" y="41" font-family="Arial" font-size="10" fill="#64748b">• Infrastructure as Code</text>
    <text x="200" y="15" font-family="Arial" font-size="10" fill="#64748b">• Container orchestration</text>
    <text x="200" y="28" font-family="Arial" font-size="10" fill="#64748b">• Monitoring &amp; logging</text>
    <text x="200" y="41" font-family="Arial" font-size="10" fill="#64748b">• Auto-scaling</text>
  </g>
</svg>