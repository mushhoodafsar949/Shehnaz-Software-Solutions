<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="k8sGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">Kubernetes Architecture</text>
  
  <!-- Master Node -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="url(#k8sGradient)"/>
    <text x="80" y="25" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Master Node</text>
    <text x="80" y="45" font-family="Arial" font-size="10" fill="white" text-anchor="middle">API Server | etcd | Scheduler</text>
  </g>
  
  <!-- Worker Nodes -->
  <g transform="translate(150, 180)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#334155"/>
    <text x="60" y="20" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Worker Node 1</text>
    <rect x="10" y="30" width="45" height="25" rx="4" fill="#3b82f6"/>
    <text x="32" y="45" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Pod</text>
    <rect x="65" y="30" width="45" height="25" rx="4" fill="#3b82f6"/>
    <text x="87" y="45" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Pod</text>
  </g>
  
  <g transform="translate(340, 180)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#334155"/>
    <text x="60" y="20" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Worker Node 2</text>
    <rect x="10" y="30" width="45" height="25" rx="4" fill="#10b981"/>
    <text x="32" y="45" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Pod</text>
    <rect x="65" y="30" width="45" height="25" rx="4" fill="#10b981"/>
    <text x="87" y="45" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Pod</text>
  </g>
  
  <g transform="translate(530, 180)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#334155"/>
    <text x="60" y="20" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Worker Node 3</text>
    <rect x="10" y="30" width="45" height="25" rx="4" fill="#f59e0b"/>
    <text x="32" y="45" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Pod</text>
    <rect x="65" y="30" width="45" height="25" rx="4" fill="#f59e0b"/>
    <text x="87" y="45" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Pod</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="400" y1="120" x2="210" y2="180" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="120" x2="400" y2="180" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="120" x2="590" y2="180" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Benefits -->
  <g transform="translate(100, 320)">
    <text x="0" y="0" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">Key Features:</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#64748b">• Container orchestration</text>
    <text x="0" y="35" font-family="Arial" font-size="12" fill="#64748b">• Auto-scaling</text>
    <text x="200" y="20" font-family="Arial" font-size="12" fill="#64748b">• Self-healing</text>
    <text x="200" y="35" font-family="Arial" font-size="12" fill="#64748b">• Service discovery</text>
    <text x="400" y="20" font-family="Arial" font-size="12" fill="#64748b">• Load balancing</text>
    <text x="400" y="35" font-family="Arial" font-size="12" fill="#64748b">• Rolling updates</text>
  </g>
</svg>
