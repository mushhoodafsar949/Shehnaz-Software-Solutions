<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="mobileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="deviceGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0" />
    </radialGradient>
    <filter id="deviceShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with Gradient Animation -->
  <rect width="400" height="300" fill="#f8fafc">
    <animate attributeName="fill" values="#f8fafc;#f1f5f9;#f8fafc" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating UI Elements -->
  <g opacity="0.2">
    <rect x="50" y="40" width="20" height="3" rx="1.5" fill="#22c55e">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-5; 0,0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="320" cy="80" r="4" fill="#166534">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,12; 0,0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <rect x="30" y="220" width="12" height="12" rx="6" fill="#4ade80">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Main Smartphone -->
  <g transform="translate(150, 60)" filter="url(#deviceShadow)">
    <!-- Phone Body with Glow Effect -->
    <rect x="0" y="0" width="100" height="180" rx="18" fill="#1e293b" filter="url(#glow)"/>
    <rect x="0" y="0" width="100" height="180" rx="18" fill="url(#deviceGlow)" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Screen -->
    <rect x="5" y="20" width="90" height="140" rx="12" fill="url(#screenGradient)"/>
    
    <!-- Notch -->
    <rect x="35" y="5" width="30" height="12" rx="6" fill="#0f172a"/>
    <circle cx="42" cy="11" r="2" fill="#64748b"/>
    <rect x="48" y="9" width="15" height="4" rx="2" fill="#64748b"/>
    
    <!-- Home Indicator -->
    <rect x="40" y="168" width="20" height="3" rx="1.5" fill="#64748b">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- App Header with Animation -->
    <rect x="10" y="25" width="80" height="25" rx="8" fill="url(#mobileGradient)">
      <animate attributeName="fill" values="url(#mobileGradient);#22c55e;url(#mobileGradient)" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="40" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0.5s" fill="freeze"/>
      Nest Tech App
    </text>

    <!-- App Icons Grid with Staggered Animation -->
    <g transform="translate(15, 60)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#3b82f6">
        <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="1s" fill="freeze"/>
      </rect>
      <rect x="23" y="0" width="18" height="18" rx="4" fill="#ef4444">
        <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="1.2s" fill="freeze"/>
      </rect>
      <rect x="46" y="0" width="18" height="18" rx="4" fill="#10b981">
        <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="1.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="1.4s" fill="freeze"/>
      </rect>
      <rect x="69" y="0" width="18" height="18" rx="4" fill="#f59e0b">
        <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="1.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="1.6s" fill="freeze"/>
      </rect>

      <!-- Row 2 -->
      <rect x="0" y="25" width="18" height="18" rx="4" fill="#8b5cf6">
        <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="1.8s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="1.8s" fill="freeze"/>
      </rect>
      <rect x="23" y="25" width="18" height="18" rx="4" fill="#f97316">
        <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="2s" fill="freeze"/>
      </rect>
      <rect x="46" y="25" width="18" height="18" rx="4" fill="#06b6d4">
        <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="2.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="2.2s" fill="freeze"/>
      </rect>
      <rect x="69" y="25" width="18" height="18" rx="4" fill="#84cc16">
        <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="2.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="2.4s" fill="freeze"/>
      </rect>

      <!-- App Icons (simplified representations) -->
      <circle cx="9" cy="9" r="3" fill="white" opacity="0.9"/>
      <rect x="29" y="6" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
      <polygon points="55,6 61,12 49,12" fill="white" opacity="0.9"/>
      <circle cx="78" cy="9" r="4" fill="white" opacity="0.9"/>
    </g>

    <!-- Bottom Navigation with Pulse Animation -->
    <rect x="10" y="120" width="80" height="35" rx="8" fill="#f1f5f9"/>
    <g transform="translate(20, 135)">
      <circle cx="10" cy="10" r="8" fill="url(#mobileGradient)">
        <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="35" cy="10" r="6" fill="#cbd5e1">
        <animate attributeName="fill" values="#cbd5e1;#22c55e;#cbd5e1" dur="6s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="10" r="6" fill="#cbd5e1">
        <animate attributeName="fill" values="#cbd5e1;#22c55e;#cbd5e1" dur="6s" begin="4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Tablet Device -->
  <g transform="translate(280, 80)" filter="url(#deviceShadow)">
    <!-- Tablet Body -->
    <rect x="0" y="0" width="80" height="120" rx="12" fill="#1e293b" opacity="0.9"/>
    <rect x="5" y="10" width="70" height="100" rx="8" fill="url(#screenGradient)"/>
    
    <!-- Tablet Screen Glow -->
    <rect x="5" y="10" width="70" height="100" rx="8" fill="url(#deviceGlow)" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Tablet Header -->
    <rect x="10" y="15" width="60" height="20" rx="4" fill="url(#mobileGradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="27" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">
      Dashboard
    </text>

    <!-- Tablet Content Grid -->
    <g transform="translate(12, 40)">
      <rect x="0" y="0" width="25" height="25" rx="3" fill="#e2e8f0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2s" fill="freeze"/>
      </rect>
      <rect x="31" y="0" width="25" height="25" rx="3" fill="#e2e8f0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.2s" fill="freeze"/>
      </rect>
      <rect x="0" y="30" width="25" height="25" rx="3" fill="#e2e8f0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.4s" fill="freeze"/>
      </rect>
      <rect x="31" y="30" width="25" height="25" rx="3" fill="#e2e8f0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.6s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Smart Watch -->
  <g transform="translate(80, 120)" filter="url(#deviceShadow)">
    <!-- Watch Body -->
    <rect x="0" y="0" width="40" height="50" rx="12" fill="#1e293b"/>
    <rect x="3" y="5" width="34" height="40" rx="8" fill="black"/>
    
    <!-- Watch Screen Glow -->
    <rect x="3" y="5" width="34" height="40" rx="8" fill="url(#deviceGlow)" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Watch Face -->
    <circle cx="20" cy="25" r="15" fill="url(#mobileGradient)" opacity="0.8">
      <animate attributeName="r" values="13;17;13" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Time Display with Animation -->
    <text x="20" y="22" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
      12:30
    </text>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="4" fill="white" text-anchor="middle">
      PM
    </text>

    <!-- Watch Band -->
    <rect x="15" y="-5" width="10" height="8" rx="2" fill="#64748b"/>
    <rect x="15" y="47" width="10" height="8" rx="2" fill="#64748b"/>
  </g>

  <!-- Data Sync Animation -->
  <g opacity="0.6">
    <!-- Sync Lines -->
    <path d="M 200 140 Q 240 120 280 140" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.7">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 200 160 Q 160 140 120 160" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.7">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </path>

    <!-- Sync Particles -->
    <circle cx="0" cy="0" r="2" fill="#4ade80">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 200,140 Q 240,120 280,140"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#4ade80">
      <animateMotion dur="2s" repeatCount="indefinite" begin="1s" path="M 200,160 Q 160,140 120,160"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Feature Labels -->
  <g transform="translate(50, 250)" opacity="0.8">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#166534" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3s" fill="freeze"/>
      Cross-Platform Development
    </text>
    <g transform="translate(0, 20)" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
      <text x="0" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3.5s" fill="freeze"/>
        • Native Performance
      </text>
      <text x="120" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="4s" fill="freeze"/>
        • Real-time Sync
      </text>
      <text x="220" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="4.5s" fill="freeze"/>
        • Multi-device Support
      </text>
    </g>
  </g>

  <!-- Performance Metrics -->
  <g transform="translate(320, 200)" opacity="0.7">
    <rect x="0" y="0" width="60" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="30" y="12" font-family="Arial, sans-serif" font-size="7" fill="#22c55e" text-anchor="middle" font-weight="bold">App Stats</text>
    
    <!-- Download Count -->
    <text x="5" y="25" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Downloads</text>
    <text x="55" y="25" font-family="Arial, sans-serif" font-size="8" fill="#22c55e" text-anchor="end" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="2s" begin="2s" fill="freeze"/>
      10K+
    </text>
    
    <!-- Rating -->
    <text x="5" y="35" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Rating</text>
    <text x="55" y="35" font-family="Arial, sans-serif" font-size="8" fill="#22c55e" text-anchor="end" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="2s" begin="2.5s" fill="freeze"/>
      4.8★
    </text>
    
    <!-- Performance -->
    <text x="5" y="45" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Speed</text>
    <text x="55" y="45" font-family="Arial, sans-serif" font-size="8" fill="#22c55e" text-anchor="end" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="2s" begin="3s" fill="freeze"/>
      99%
    </text>
  </g>
</svg>
