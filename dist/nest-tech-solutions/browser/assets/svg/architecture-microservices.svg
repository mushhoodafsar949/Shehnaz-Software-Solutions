<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="microGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">Microservices Architecture</text>
  
  <!-- API Gateway -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="url(#microGradient)"/>
    <text x="50" y="25" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">API</text>
    <text x="50" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Gateway</text>
  </g>
  
  <!-- Microservices -->
  <!-- User Service -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="url(#serviceGradient)"/>
    <text x="60" y="30" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">User Service</text>
    <text x="60" y="50" font-family="Arial" font-size="10" fill="#cbd5e1" text-anchor="middle">Authentication</text>
    <text x="60" y="65" font-family="Arial" font-size="10" fill="#cbd5e1" text-anchor="middle">User Management</text>
  </g>
  
  <!-- Product Service -->
  <g transform="translate(280, 200)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="url(#serviceGradient)"/>
    <text x="60" y="30" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Product Service</text>
    <text x="60" y="50" font-family="Arial" font-size="10" fill="#cbd5e1" text-anchor="middle">Catalog</text>
    <text x="60" y="65" font-family="Arial" font-size="10" fill="#cbd5e1" text-anchor="middle">Inventory</text>
  </g>
  
  <!-- Order Service -->
  <g transform="translate(460, 200)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="url(#serviceGradient)"/>
    <text x="60" y="30" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Order Service</text>
    <text x="60" y="50" font-family="Arial" font-size="10" fill="#cbd5e1" text-anchor="middle">Processing</text>
    <text x="60" y="65" font-family="Arial" font-size="10" fill="#cbd5e1" text-anchor="middle">Fulfillment</text>
  </g>
  
  <!-- Payment Service -->
  <g transform="translate(640, 200)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="url(#serviceGradient)"/>
    <text x="60" y="30" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Payment Service</text>
    <text x="60" y="50" font-family="Arial" font-size="10" fill="#cbd5e1" text-anchor="middle">Processing</text>
    <text x="60" y="65" font-family="Arial" font-size="10" fill="#cbd5e1" text-anchor="middle">Billing</text>
  </g>
  
  <!-- Databases -->
  <g transform="translate(120, 350)">
    <ellipse cx="40" cy="30" rx="40" ry="20" fill="#3b82f6"/>
    <text x="40" y="35" font-family="Arial" font-size="10" fill="white" text-anchor="middle">User DB</text>
  </g>
  
  <g transform="translate(300, 350)">
    <ellipse cx="40" cy="30" rx="40" ry="20" fill="#3b82f6"/>
    <text x="40" y="35" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Product DB</text>
  </g>
  
  <g transform="translate(480, 350)">
    <ellipse cx="40" cy="30" rx="40" ry="20" fill="#3b82f6"/>
    <text x="40" y="35" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Order DB</text>
  </g>
  
  <g transform="translate(660, 350)">
    <ellipse cx="40" cy="30" rx="40" ry="20" fill="#3b82f6"/>
    <text x="40" y="35" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Payment DB</text>
  </g>
  
  <!-- Connection Lines -->
  <!-- API Gateway to Services -->
  <line x1="400" y1="140" x2="160" y2="200" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="140" x2="340" y2="200" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="140" x2="520" y2="200" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="140" x2="700" y2="200" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Services to Databases -->
  <line x1="160" y1="280" x2="160" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="340" y1="280" x2="340" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="280" x2="520" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="700" y1="280" x2="700" y2="350" stroke="#64748b" stroke-width="2"/>
  
  <!-- Benefits -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">Benefits:</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#64748b">• Independent scaling</text>
    <text x="0" y="35" font-family="Arial" font-size="12" fill="#64748b">• Technology diversity</text>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#64748b">• Fault isolation</text>
    <text x="200" y="20" font-family="Arial" font-size="12" fill="#64748b">• Faster deployment</text>
    <text x="200" y="35" font-family="Arial" font-size="12" fill="#64748b">• Team autonomy</text>
    <text x="200" y="50" font-family="Arial" font-size="12" fill="#64748b">• Better maintainability</text>
  </g>
</svg>
