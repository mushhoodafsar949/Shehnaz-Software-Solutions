<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="metricsGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" fill="#166534" text-anchor="middle" font-weight="bold">Success Metrics</text>
  
  <!-- Dashboard -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="10" y="10" width="280" height="30" rx="4" fill="url(#metricsGradient)"/>
    <text x="150" y="28" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Analytics Dashboard</text>
    
    <!-- Metrics Cards -->
    <g transform="translate(20, 60)">
      <!-- Projects Completed -->
      <rect x="0" y="0" width="60" height="40" rx="4" fill="#f1f5f9"/>
      <text x="30" y="15" font-family="Arial" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="bold">500+</text>
      <text x="30" y="28" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">Projects</text>
      <text x="30" y="36" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">Completed</text>
      
      <!-- Client Satisfaction -->
      <rect x="70" y="0" width="60" height="40" rx="4" fill="#f1f5f9"/>
      <text x="100" y="15" font-family="Arial" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="bold">98%</text>
      <text x="100" y="28" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">Client</text>
      <text x="100" y="36" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">Satisfaction</text>
      
      <!-- Response Time -->
      <rect x="140" y="0" width="60" height="40" rx="4" fill="#f1f5f9"/>
      <text x="170" y="15" font-family="Arial" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="bold">24h</text>
      <text x="170" y="28" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">Response</text>
      <text x="170" y="36" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">Time</text>
      
      <!-- Team Size -->
      <rect x="210" y="0" width="60" height="40" rx="4" fill="#f1f5f9"/>
      <text x="240" y="15" font-family="Arial" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="bold">50+</text>
      <text x="240" y="28" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">Team</text>
      <text x="240" y="36" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">Members</text>
    </g>
    
    <!-- Chart Area -->
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="260" height="40" rx="4" fill="#f8fafc"/>
      
      <!-- Bar Chart -->
      <rect x="10" y="30" width="15" height="8" fill="#22c55e"/>
      <rect x="30" y="25" width="15" height="13" fill="#22c55e"/>
      <rect x="50" y="20" width="15" height="18" fill="#22c55e"/>
      <rect x="70" y="15" width="15" height="23" fill="#22c55e"/>
      <rect x="90" y="10" width="15" height="28" fill="#22c55e"/>
      <rect x="110" y="8" width="15" height="30" fill="#22c55e"/>
      
      <!-- Trend Line -->
      <polyline points="17,35 37,30 57,25 77,20 97,15 117,10" 
                stroke="#166534" stroke-width="2" fill="none"/>
      
      <!-- Data Points -->
      <circle cx="17" cy="35" r="2" fill="#166534"/>
      <circle cx="37" cy="30" r="2" fill="#166534"/>
      <circle cx="57" cy="25" r="2" fill="#166534"/>
      <circle cx="77" cy="20" r="2" fill="#166534"/>
      <circle cx="97" cy="15" r="2" fill="#166534"/>
      <circle cx="117" cy="10" r="2" fill="#166534"/>
      
      <text x="130" y="25" font-family="Arial" font-size="10" fill="#64748b">Growth Trend</text>
    </g>
  </g>
  
  <!-- Key Performance Indicators -->
  <g transform="translate(50, 250)">
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#166534" font-weight="bold">KPIs:</text>
    <text x="0" y="15" font-family="Arial" font-size="10" fill="#64748b">• On-time delivery: 95%</text>
    <text x="0" y="28" font-family="Arial" font-size="10" fill="#64748b">• Budget adherence: 98%</text>
    <text x="200" y="15" font-family="Arial" font-size="10" fill="#64748b">• Client retention: 90%</text>
    <text x="200" y="28" font-family="Arial" font-size="10" fill="#64748b">• Quality score: 4.9/5</text>
  </g>
</svg>