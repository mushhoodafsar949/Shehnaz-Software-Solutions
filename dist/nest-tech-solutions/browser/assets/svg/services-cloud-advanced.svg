<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#166534;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b" />
      <stop offset="100%" style="stop-color:#0f172a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc">
    <animate attributeName="fill" values="#f8fafc;#f1f5f9;#f8fafc" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating Data Bits -->
  <g opacity="0.4">
    <circle cx="80" cy="60" r="2" fill="#22c55e">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-5; 0,0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="80" r="1.5" fill="#4ade80">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,8; 0,0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <rect x="50" y="220" width="3" height="3" rx="1.5" fill="#166534">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Main Cloud -->
  <g transform="translate(150, 70)">
    <!-- Cloud Shape with Animation -->
    <ellipse cx="50" cy="40" rx="60" ry="25" fill="url(#cloudGradient)" filter="url(#glow)">
      <animate attributeName="rx" values="58;64;58" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="23;27;23" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="20" cy="40" r="20" fill="url(#cloudGradient)">
      <animate attributeName="r" values="18;22;18" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="40" r="20" fill="url(#cloudGradient)">
      <animate attributeName="r" values="19;21;19" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="25" r="15" fill="url(#cloudGradient)">
      <animate attributeName="r" values="14;16;14" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="65" cy="25" r="15" fill="url(#cloudGradient)">
      <animate attributeName="r" values="13;17;13" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cloud Labels -->
    <text x="50" y="35" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1s" fill="freeze"/>
      AWS CLOUD
    </text>
    <text x="50" y="48" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" opacity="0.9">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.5s" fill="freeze"/>
      Infrastructure
    </text>
  </g>

  <!-- Server Racks -->
  <g transform="translate(50, 150)">
    <!-- Server 1 -->
    <rect x="0" y="0" width="30" height="40" rx="3" fill="url(#serverGradient)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2s" fill="freeze"/>
    </rect>
    <rect x="2" y="5" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="13" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="21" width="26" height="6" rx="1" fill="#64748b">
      <animate attributeName="fill" values="#64748b;#22c55e;#64748b" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="29" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Status LEDs -->
    <circle cx="25" cy="8" r="1.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="16" r="1.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="24" r="1.5" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="32" r="1.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.7s" repeatCount="indefinite"/>
    </circle>

    <!-- Server 2 -->
    <rect x="40" y="0" width="30" height="40" rx="3" fill="url(#serverGradient)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.3s" fill="freeze"/>
    </rect>
    <rect x="42" y="5" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="13" width="26" height="6" rx="1" fill="#64748b">
      <animate attributeName="fill" values="#64748b;#22c55e;#64748b" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="21" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="29" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Server 3 -->
    <rect x="80" y="0" width="30" height="40" rx="3" fill="url(#serverGradient)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.6s" fill="freeze"/>
    </rect>
    <rect x="82" y="5" width="26" height="6" rx="1" fill="#64748b">
      <animate attributeName="fill" values="#64748b;#22c55e;#64748b" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="82" y="13" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="82" y="21" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="82" y="29" width="26" height="6" rx="1" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Docker Containers -->
  <g transform="translate(280, 140)">
    <text x="40" y="0" font-family="Arial, sans-serif" font-size="8" fill="#166534" text-anchor="middle" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3s" fill="freeze"/>
      Containers
    </text>
    
    <!-- Container Grid -->
    <rect x="0" y="10" width="25" height="25" rx="3" fill="#2563eb">
      <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="3.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="3.5s" fill="freeze"/>
    </rect>
    <text x="12.5" y="26" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">App</text>
    
    <rect x="30" y="10" width="25" height="25" rx="3" fill="#2563eb">
      <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="3.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="3.7s" fill="freeze"/>
    </rect>
    <text x="42.5" y="26" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">DB</text>
    
    <rect x="60" y="10" width="25" height="25" rx="3" fill="#2563eb">
      <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="3.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="3.9s" fill="freeze"/>
    </rect>
    <text x="72.5" y="26" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">API</text>
    
    <rect x="15" y="40" width="25" height="25" rx="3" fill="#2563eb">
      <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="4.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="4.1s" fill="freeze"/>
    </rect>
    <text x="27.5" y="56" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">Web</text>
    
    <rect x="45" y="40" width="25" height="25" rx="3" fill="#2563eb">
      <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="4.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="4.3s" fill="freeze"/>
    </rect>
    <text x="57.5" y="56" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">Cache</text>

    <!-- Health Indicators -->
    <circle cx="12.5" cy="75" r="2" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42.5" cy="75" r="2" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72.5" cy="75" r="2" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="27.5" cy="85" r="2" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="57.5" cy="85" r="2" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Data Flow Connections -->
  <g opacity="0.7">
    <!-- Server to Cloud -->
    <path d="M 110 170 Q 150 140 200 120" stroke="#22c55e" stroke-width="2" fill="none">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Cloud to Containers -->
    <path d="M 250 120 Q 280 130 320 150" stroke="#22c55e" stroke-width="2" fill="none">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    
    <!-- Data Packets -->
    <circle cx="0" cy="0" r="2" fill="#4ade80">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 110,170 Q 150,140 200,120"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#4ade80">
      <animateMotion dur="3s" repeatCount="indefinite" begin="1s" path="M 250,120 Q 280,130 320,150"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Load Balancer -->
  <g transform="translate(180, 200)">
    <rect x="0" y="0" width="80" height="25" rx="6" fill="#8b5cf6">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="4.5s" fill="freeze"/>
    </rect>
    <text x="40" y="17" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">
      Load Balancer
    </text>
    
    <!-- Load Bars -->
    <rect x="10" y="30" width="15" height="2" rx="1" fill="#10b981">
      <animate attributeName="width" values="5;15;10;15" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="30" width="15" height="2" rx="1" fill="#10b981">
      <animate attributeName="width" values="10;15;5;15" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="30" width="15" height="2" rx="1" fill="#10b981">
      <animate attributeName="width" values="15;5;15;10" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Performance Dashboard -->
  <g transform="translate(20, 20)" opacity="0.8">
    <rect x="0" y="0" width="100" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="50" y="12" font-family="Arial, sans-serif" font-size="7" fill="#22c55e" text-anchor="middle" font-weight="bold">
      Cloud Metrics
    </text>
    
    <!-- CPU -->
    <text x="8" y="25" font-family="Arial, sans-serif" font-size="5" fill="#cbd5e1">CPU</text>
    <rect x="20" y="22" width="60" height="3" rx="1.5" fill="#374151"/>
    <rect x="20" y="22" width="0" height="3" rx="1.5" fill="#22c55e">
      <animate attributeName="width" values="0;30;40;25;35" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- RAM -->
    <text x="8" y="35" font-family="Arial, sans-serif" font-size="5" fill="#cbd5e1">RAM</text>
    <rect x="20" y="32" width="60" height="3" rx="1.5" fill="#374151"/>
    <rect x="20" y="32" width="0" height="3" rx="1.5" fill="#22c55e">
      <animate attributeName="width" values="0;20;30;15;25" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Network -->
    <text x="8" y="45" font-family="Arial, sans-serif" font-size="5" fill="#cbd5e1">NET</text>
    <rect x="20" y="42" width="60" height="3" rx="1.5" fill="#374151"/>
    <rect x="20" y="42" width="0" height="3" rx="1.5" fill="#22c55e">
      <animate attributeName="width" values="0;45;15;40;20" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Service Labels -->
  <g transform="translate(50, 250)" opacity="0.9">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#166534" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="5s" fill="freeze"/>
      Cloud & DevOps Solutions
    </text>
    <g transform="translate(0, 15)" font-family="Arial, sans-serif" font-size="8" fill="#64748b">
      <text x="0" y="0">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="5.5s" fill="freeze"/>
        • Auto-scaling • Container Orchestration • CI/CD Pipelines • Monitoring
      </text>
    </g>
  </g>
</svg>
