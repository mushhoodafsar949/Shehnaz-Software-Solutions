<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="eventGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">Event-Driven Architecture</text>
  
  <!-- Event Bus -->
  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="url(#eventGradient)"/>
    <text x="100" y="30" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Event Bus (Kafka)</text>
  </g>
  
  <!-- Producers -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="100" height="40" rx="6" fill="#3b82f6"/>
    <text x="50" y="25" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">User Service</text>
  </g>
  
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="100" height="40" rx="6" fill="#3b82f6"/>
    <text x="50" y="25" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Order Service</text>
  </g>
  
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="100" height="40" rx="6" fill="#3b82f6"/>
    <text x="50" y="25" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Payment Service</text>
  </g>
  
  <!-- Consumers -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="100" height="40" rx="6" fill="#10b981"/>
    <text x="50" y="25" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Email Service</text>
  </g>
  
  <g transform="translate(650, 140)">
    <rect x="0" y="0" width="100" height="40" rx="6" fill="#10b981"/>
    <text x="50" y="25" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Analytics</text>
  </g>
  
  <g transform="translate(650, 200)">
    <rect x="0" y="0" width="100" height="40" rx="6" fill="#10b981"/>
    <text x="50" y="25" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Audit Service</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="150" y1="100" x2="300" y2="160" stroke="#22c55e" stroke-width="2"/>
  <line x1="150" y1="160" x2="300" y2="175" stroke="#22c55e" stroke-width="2"/>
  <line x1="150" y1="220" x2="300" y2="190" stroke="#22c55e" stroke-width="2"/>
  
  <line x1="500" y1="160" x2="650" y2="100" stroke="#22c55e" stroke-width="2"/>
  <line x1="500" y1="175" x2="650" y2="160" stroke="#22c55e" stroke-width="2"/>
  <line x1="500" y1="190" x2="650" y2="220" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Benefits -->
  <g transform="translate(100, 300)">
    <text x="0" y="0" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">Benefits:</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#64748b">• Loose coupling</text>
    <text x="0" y="35" font-family="Arial" font-size="12" fill="#64748b">• Scalability</text>
    <text x="200" y="20" font-family="Arial" font-size="12" fill="#64748b">• Asynchronous processing</text>
    <text x="200" y="35" font-family="Arial" font-size="12" fill="#64748b">• Event sourcing</text>
    <text x="450" y="20" font-family="Arial" font-size="12" fill="#64748b">• Real-time processing</text>
    <text x="450" y="35" font-family="Arial" font-size="12" fill="#64748b">• Fault tolerance</text>
  </g>
</svg>