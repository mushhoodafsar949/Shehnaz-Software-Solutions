<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">Hybrid Cloud Architecture</text>
  
  <!-- On-Premises -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#64748b"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">On-Premises</text>
    <rect x="20" y="40" width="60" height="30" rx="4" fill="#3b82f6"/>
    <text x="50" y="58" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Legacy Apps</text>
    <rect x="120" y="40" width="60" height="30" rx="4" fill="#ef4444"/>
    <text x="150" y="58" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Databases</text>
    <rect x="20" y="80" width="160" height="20" rx="4" fill="#f59e0b"/>
    <text x="100" y="93" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Private Network</text>
  </g>
  
  <!-- Public Cloud -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#cloudGradient)"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Public Cloud (AWS/Azure)</text>
    <rect x="20" y="40" width="60" height="30" rx="4" fill="#10b981"/>
    <text x="50" y="58" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Microservices</text>
    <rect x="120" y="40" width="60" height="30" rx="4" fill="#8b5cf6"/>
    <text x="150" y="58" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Serverless</text>
    <rect x="20" y="80" width="160" height="20" rx="4" fill="#f97316"/>
    <text x="100" y="93" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Auto-scaling Infrastructure</text>
  </g>
  
  <!-- Hybrid Connection -->
  <g transform="translate(350, 140)">
    <rect x="0" y="0" width="100" height="40" rx="6" fill="#1e293b"/>
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Hybrid</text>
    <text x="50" y="28" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Connection</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="300" y1="160" x2="350" y2="160" stroke="#22c55e" stroke-width="3"/>
  <line x1="450" y1="160" x2="500" y2="160" stroke="#22c55e" stroke-width="3"/>
  
  <!-- Management Layer -->
  <g transform="translate(300, 270)">
    <rect x="0" y="0" width="200" height="40" rx="6" fill="#475569"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Unified Management &amp; Monitoring</text>
  </g>
  
  <!-- Benefits -->
  <g transform="translate(100, 340)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#166534" font-weight="bold">Benefits:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#64748b">• Flexibility • Cost optimization • Compliance • Gradual migration</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#64748b">• Data sovereignty • Risk mitigation • Best of both worlds</text>
  </g>
</svg>
