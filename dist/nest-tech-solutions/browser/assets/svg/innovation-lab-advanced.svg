<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="innovationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <radialGradient id="lightbulbGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="labGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc">
    <animate attributeName="fill" values="#f8fafc;#f1f5f9;#f8fafc" dur="15s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating Innovation Elements -->
  <g opacity="0.3">
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="12" fill="#22c55e" transform="rotate(20)">
      💡
      <animateTransform attributeName="transform" type="rotate" values="20;30;20" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="60" font-family="Arial, sans-serif" font-size="10" fill="#166534" transform="rotate(-15)">
      🔬
      <animateTransform attributeName="transform" type="rotate" values="-15;-5;-15" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="250" font-family="Arial, sans-serif" font-size="8" fill="#4ade80" transform="rotate(25)">
      ⚗️
      <animateTransform attributeName="transform" type="rotate" values="25;35;25" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </text>
    <circle cx="350" cy="200" r="3" fill="#f59e0b">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,8; 0,0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central Innovation Hub -->
  <g transform="translate(150, 60)">
    <!-- Main Lightbulb with Advanced Animation -->
    <g>
      <!-- Lightbulb Glow -->
      <circle cx="0" cy="0" r="40" fill="url(#lightbulbGlow)" opacity="0.6">
        <animate attributeName="r" values="35;45;35" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Lightbulb Body -->
      <circle cx="0" cy="0" r="20" fill="url(#innovationGradient)" filter="url(#glow)">
        <animate attributeName="r" values="18;22;18" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="0.5s" fill="freeze"/>
      </circle>
      
      <!-- Lightbulb Base -->
      <rect x="-8" y="15" width="16" height="8" rx="2" fill="#64748b">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1s" fill="freeze"/>
      </rect>
      
      <!-- Idea Sparks -->
      <g opacity="0.8">
        <text x="-25" y="-15" font-family="Arial, sans-serif" font-size="8" fill="#fbbf24">
          <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
          ✨
        </text>
        <text x="20" y="-10" font-family="Arial, sans-serif" font-size="6" fill="#fbbf24">
          <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
          ✨
        </text>
        <text x="15" y="25" font-family="Arial, sans-serif" font-size="7" fill="#fbbf24">
          <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
          ✨
        </text>
        <text x="-20" y="20" font-family="Arial, sans-serif" font-size="5" fill="#fbbf24">
          <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
          ✨
        </text>
      </g>
      
      <!-- Inner Innovation Symbol -->
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
        <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="1.5s" fill="freeze"/>
        🚀
      </text>
    </g>
    
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2s" fill="freeze"/>
      Innovation Hub
    </text>
  </g>

  <!-- Research Equipment -->
  <!-- Microscope -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#1e293b" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="2.5s" fill="freeze"/>
    </rect>
    <!-- Eyepiece -->
    <circle cx="15" cy="10" r="8" fill="#22c55e">
      <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Objective Lens -->
    <rect x="12" y="25" width="6" height="15" fill="#64748b"/>
    <!-- Base -->
    <rect x="5" y="35" width="20" height="5" rx="2" fill="#64748b"/>
    
    <!-- Scanning Animation -->
    <circle cx="15" cy="10" r="4" fill="none" stroke="#4ade80" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;12;4" dur="2s" begin="3s" repeatCount="indefinite"/>
    </circle>
    
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="bold">
      Research Lab
    </text>
  </g>

  <!-- Computer Workstation -->
  <g transform="translate(250, 110)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#1e293b" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3s" fill="freeze"/>
    </rect>
    <rect x="3" y="3" width="54" height="34" rx="2" fill="#0f172a"/>
    
    <!-- Screen Glow -->
    <rect x="3" y="3" width="54" height="34" rx="2" fill="url(#labGlow)" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- AI Development Interface -->
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="6" fill="#22c55e" text-anchor="middle" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3.5s" fill="freeze"/>
      AI Model Training
    </text>
    
    <!-- Progress Bars -->
    <rect x="8" y="20" width="44" height="3" rx="1.5" fill="#374151"/>
    <rect x="8" y="20" width="0" height="3" rx="1.5" fill="#22c55e">
      <animate attributeName="width" values="0;35;44;35;40" dur="4s" begin="4s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="8" y="26" width="44" height="3" rx="1.5" fill="#374151"/>
    <rect x="8" y="26" width="0" height="3" rx="1.5" fill="#3b82f6">
      <animate attributeName="width" values="0;25;40;30;38" dur="3s" begin="4.5s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="8" y="32" width="44" height="3" rx="1.5" fill="#374151"/>
    <rect x="8" y="32" width="0" height="3" rx="1.5" fill="#f59e0b">
      <animate attributeName="width" values="0;20;35;25;42" dur="3.5s" begin="5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Status Indicators -->
    <circle cx="55" cy="8" r="2" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="bold">
      AI Development
    </text>
  </g>

  <!-- Prototype Device -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="25" height="35" rx="3" fill="#3b82f6" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="3.5s" fill="freeze"/>
      <animate attributeName="fill" values="#3b82f6;#60a5fa;#3b82f6" dur="4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Device Screen -->
    <rect x="3" y="5" width="19" height="15" rx="2" fill="#0f172a"/>
    
    <!-- Interface Elements -->
    <circle cx="12.5" cy="12" r="4" fill="#22c55e">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="8" y="25" width="9" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="8" y="29" width="9" height="3" rx="1" fill="white" opacity="0.6"/>
    
    <!-- Device Activation -->
    <circle cx="12.5" cy="12" r="8" fill="none" stroke="#22c55e" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;12;4" dur="3s" begin="4s" repeatCount="indefinite"/>
    </circle>
    
    <text x="12.5" y="50" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="bold">
      Prototype
    </text>
  </g>

  <!-- Innovation Process Flow -->
  <g transform="translate(50, 180)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="bold">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="5s" fill="freeze"/>
      Innovation Pipeline
    </text>
    
    <!-- Process Steps -->
    <!-- Step 1: Ideation -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="60" height="30" rx="6" fill="url(#innovationGradient)" opacity="0.8">
        <animate attributeName="opacity" values="0;0.8;0.8;0.8" dur="1s" begin="5.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0.8;1;1" dur="0.5s" begin="5.5s" fill="freeze"/>
      </rect>
      <text x="30" y="20" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">
        💡 Ideation
      </text>
      
      <!-- Brainstorm Animation -->
      <g transform="translate(30, -10)" opacity="0.6">
        <circle cx="0" cy="0" r="2" fill="#fbbf24">
          <animate attributeName="opacity" values="0;1;0" dur="1s" begin="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-8" cy="-5" r="1.5" fill="#fbbf24">
          <animate attributeName="opacity" values="0;1;0" dur="1s" begin="6.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="8" cy="-3" r="1" fill="#fbbf24">
          <animate attributeName="opacity" values="0;1;0" dur="1s" begin="6.4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Arrow 1 -->
    <path d="M 65 30 L 75 30" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="6s" fill="freeze"/>
    </path>

    <!-- Step 2: Research -->
    <g transform="translate(80, 15)">
      <rect x="0" y="0" width="60" height="30" rx="6" fill="url(#innovationGradient)" opacity="0.8">
        <animate attributeName="opacity" values="0;0.8;0.8;0.8" dur="1s" begin="6.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0.8;1;1" dur="0.5s" begin="6.2s" fill="freeze"/>
      </rect>
      <text x="30" y="20" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">
        🔬 Research
      </text>
      
      <!-- Research Data Animation -->
      <g transform="translate(15, 10)" opacity="0.7">
        <rect x="0" y="0" width="8" height="2" rx="1" fill="white">
          <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="6.5s" fill="freeze"/>
        </rect>
        <rect x="10" y="0" width="12" height="2" rx="1" fill="white">
          <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="6.7s" fill="freeze"/>
        </rect>
        <rect x="25" y="0" width="6" height="2" rx="1" fill="white">
          <animate attributeName="opacity" values="0;1;1;1" dur="0.5s" begin="6.9s" fill="freeze"/>
        </rect>
      </g>
    </g>

    <!-- Arrow 2 -->
    <path d="M 145 30 L 155 30" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="6.5s" fill="freeze"/>
    </path>

    <!-- Step 3: Prototype -->
    <g transform="translate(160, 15)">
      <rect x="0" y="0" width="60" height="30" rx="6" fill="url(#innovationGradient)" opacity="0.8">
        <animate attributeName="opacity" values="0;0.8;0.8;0.8" dur="1s" begin="6.7s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0.8;1;1" dur="0.5s" begin="6.7s" fill="freeze"/>
      </rect>
      <text x="30" y="20" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">
        🔧 Prototype
      </text>
      
      <!-- Build Animation -->
      <g transform="translate(20, 8)" opacity="0.7">
        <rect x="0" y="0" width="4" height="4" rx="1" fill="white">
          <animate attributeName="opacity" values="0;1;1;1" dur="0.3s" begin="7s" fill="freeze"/>
        </rect>
        <rect x="6" y="0" width="4" height="4" rx="1" fill="white">
          <animate attributeName="opacity" values="0;1;1;1" dur="0.3s" begin="7.2s" fill="freeze"/>
        </rect>
        <rect x="12" y="0" width="4" height="4" rx="1" fill="white">
          <animate attributeName="opacity" values="0;1;1;1" dur="0.3s" begin="7.4s" fill="freeze"/>
        </rect>
      </g>
    </g>

    <!-- Arrow 3 -->
    <path d="M 225 30 L 235 30" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="7s" fill="freeze"/>
    </path>

    <!-- Step 4: Deploy -->
    <g transform="translate(240, 15)">
      <rect x="0" y="0" width="60" height="30" rx="6" fill="url(#innovationGradient)" opacity="0.8">
        <animate attributeName="opacity" values="0;0.8;0.8;0.8" dur="1s" begin="7.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0.8;1;1" dur="0.5s" begin="7.2s" fill="freeze"/>
      </rect>
      <text x="30" y="20" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">
        🚀 Deploy
      </text>
      
      <!-- Launch Animation -->
      <g transform="translate(30, -5)" opacity="0.8">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="6" fill="#fbbf24">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,-15" dur="2s" begin="7.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.3;0" dur="2s" begin="7.5s" repeatCount="indefinite"/>
          🚀
        </text>
      </g>
    </g>
  </g>

  <!-- Innovation Metrics -->
  <g transform="translate(20, 250)" opacity="0.8">
    <rect x="0" y="0" width="360" height="30" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1">
      <animate attributeName="opacity" values="0;1;1;1" dur="1s" begin="8s" fill="freeze"/>
    </rect>
    <text x="180" y="12" font-family="Arial, sans-serif" font-size="8" fill="#22c55e" text-anchor="middle" font-weight="bold">
      Innovation Metrics
    </text>
    
    <!-- Patents Filed -->
    <text x="20" y="24" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Patents: 15+</text>
    
    <!-- R&D Investment -->
    <text x="100" y="24" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">R&D: 25%</text>
    
    <!-- Success Rate -->
    <text x="180" y="24" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Success: 78%</text>
    
    <!-- Time to Market -->
    <text x="260" y="24" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">TTM: 3 months</text>
    
    <!-- Innovation Index -->
    <text x="320" y="24" font-family="Arial, sans-serif" font-size="6" fill="#cbd5e1">Index: 9.2/10</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Ambient Innovation Energy -->
  <g opacity="0.2">
    <circle cx="100" cy="100" r="2" fill="#fbbf24">
      <animateTransform attributeName="transform" type="translate" values="0,0; 50,-20; 100,10; 150,-30; 200,20" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="150" r="1.5" fill="#22c55e">
      <animateTransform attributeName="transform" type="translate" values="0,0; -40,15; -80,-10; -120,25; -160,-5" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
