<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="teamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" fill="#166534" text-anchor="middle" font-weight="bold">Team Collaboration</text>
  
  <!-- Team Members -->
  <g transform="translate(80, 70)">
    <!-- Person 1 -->
    <circle cx="0" cy="0" r="25" fill="url(#teamGradient)"/>
    <circle cx="0" cy="-5" r="8" fill="white"/>
    <path d="M -12 10 Q 0 5 12 10" stroke="white" stroke-width="3" fill="none"/>
    <text x="0" y="40" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Developer</text>
  </g>
  
  <g transform="translate(200, 70)">
    <!-- Person 2 -->
    <circle cx="0" cy="0" r="25" fill="url(#teamGradient)"/>
    <circle cx="0" cy="-5" r="8" fill="white"/>
    <path d="M -12 10 Q 0 5 12 10" stroke="white" stroke-width="3" fill="none"/>
    <text x="0" y="40" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Designer</text>
  </g>
  
  <g transform="translate(320, 70)">
    <!-- Person 3 -->
    <circle cx="0" cy="0" r="25" fill="url(#teamGradient)"/>
    <circle cx="0" cy="-5" r="8" fill="white"/>
    <path d="M -12 10 Q 0 5 12 10" stroke="white" stroke-width="3" fill="none"/>
    <text x="0" y="40" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Manager</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="105" y1="70" x2="175" y2="70" stroke="#22c55e" stroke-width="2"/>
  <line x1="225" y1="70" x2="295" y2="70" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Collaboration Tools -->
  <g transform="translate(120, 150)">
    <!-- Slack -->
    <rect x="0" y="0" width="40" height="30" rx="5" fill="#4a154b"/>
    <text x="20" y="20" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Slack</text>
    
    <!-- GitHub -->
    <rect x="50" y="0" width="40" height="30" rx="5" fill="#24292e"/>
    <text x="70" y="20" font-family="Arial" font-size="8" fill="white" text-anchor="middle">GitHub</text>
    
    <!-- Figma -->
    <rect x="100" y="0" width="40" height="30" rx="5" fill="#f24e1e"/>
    <text x="120" y="20" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Figma</text>
    
    <!-- Jira -->
    <rect x="150" y="0" width="40" height="30" rx="5" fill="#0052cc"/>
    <text x="170" y="20" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Jira</text>
  </g>
  
  <!-- Workflow -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#166534" font-weight="bold">Workflow:</text>
    <text x="0" y="15" font-family="Arial" font-size="10" fill="#64748b">• Agile methodology</text>
    <text x="0" y="28" font-family="Arial" font-size="10" fill="#64748b">• Daily standups</text>
    <text x="0" y="41" font-family="Arial" font-size="10" fill="#64748b">• Sprint planning</text>
    <text x="200" y="15" font-family="Arial" font-size="10" fill="#64748b">• Code reviews</text>
    <text x="200" y="28" font-family="Arial" font-size="10" fill="#64748b">• Continuous integration</text>
    <text x="200" y="41" font-family="Arial" font-size="10" fill="#64748b">• Regular retrospectives</text>
  </g>
</svg>