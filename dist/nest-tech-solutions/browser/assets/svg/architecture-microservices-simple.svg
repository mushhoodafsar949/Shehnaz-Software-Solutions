<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="microSimpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">Microservices Simple Architecture</text>
  
  <!-- Client -->
  <rect x="350" y="70" width="100" height="40" rx="6" fill="#3b82f6"/>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Client App</text>
  
  <!-- API Gateway -->
  <rect x="350" y="140" width="100" height="40" rx="6" fill="url(#microSimpleGradient)"/>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">API Gateway</text>
  
  <!-- Microservices -->
  <rect x="150" y="220" width="80" height="50" rx="6" fill="#64748b"/>
  <text x="190" y="240" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">User Service</text>
  <text x="190" y="255" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Authentication</text>
  
  <rect x="260" y="220" width="80" height="50" rx="6" fill="#64748b"/>
  <text x="300" y="240" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Order Service</text>
  <text x="300" y="255" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">E-commerce</text>
  
  <rect x="370" y="220" width="80" height="50" rx="6" fill="#64748b"/>
  <text x="410" y="240" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Payment Service</text>
  <text x="410" y="255" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Transactions</text>
  
  <rect x="480" y="220" width="80" height="50" rx="6" fill="#64748b"/>
  <text x="520" y="240" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Notification</text>
  <text x="520" y="255" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Email/SMS</text>
  
  <!-- Databases -->
  <rect x="150" y="300" width="80" height="40" rx="6" fill="#f59e0b"/>
  <text x="190" y="325" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">User DB</text>
  
  <rect x="260" y="300" width="80" height="40" rx="6" fill="#f59e0b"/>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Order DB</text>
  
  <rect x="370" y="300" width="80" height="40" rx="6" fill="#f59e0b"/>
  <text x="410" y="325" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Payment DB</text>
  
  <rect x="480" y="300" width="80" height="40" rx="6" fill="#f59e0b"/>
  <text x="520" y="325" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Log DB</text>
  
  <!-- Connection Lines -->
  <line x1="400" y1="110" x2="400" y2="140" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="180" x2="190" y2="220" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="180" x2="300" y2="220" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="180" x2="410" y2="220" stroke="#22c55e" stroke-width="2"/>
  <line x1="400" y1="180" x2="520" y2="220" stroke="#22c55e" stroke-width="2"/>
  
  <line x1="190" y1="270" x2="190" y2="300" stroke="#22c55e" stroke-width="2"/>
  <line x1="300" y1="270" x2="300" y2="300" stroke="#22c55e" stroke-width="2"/>
  <line x1="410" y1="270" x2="410" y2="300" stroke="#22c55e" stroke-width="2"/>
  <line x1="520" y1="270" x2="520" y2="300" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Benefits -->
  <g transform="translate(100, 360)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#166534" font-weight="bold">Benefits:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#64748b">• Independent deployment • Technology diversity • Fault isolation • Scalability</text>
  </g>
</svg>