<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700">
  <defs>
    <linearGradient id="gradientMobileHome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3949ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Phone Frame -->
  <rect width="400" height="700" fill="#1a1a1a" rx="40"/>
  <rect x="20" y="40" width="360" height="620" fill="#ffffff" rx="30"/>
  
  <!-- Status Bar -->
  <rect x="20" y="40" width="360" height="30" fill="#1a237e"/>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">9:41 AM</text>
  
  <!-- Header -->
  <rect x="20" y="70" width="360" height="80" fill="url(#gradientMobileHome)"/>
  <text x="200" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Welcome Back!</text>
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">John Doe</text>
  
  <!-- Balance Card -->
  <rect x="40" y="170" width="320" height="140" fill="url(#gradientMobileHome)" rx="16"/>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">Total Balance</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">$45,230</text>
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">Available Balance</text>
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="12" fill="#4caf50" text-anchor="middle">+$2,450 this month</text>
  
  <!-- Quick Actions -->
  <text x="40" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e">Quick Actions</text>
  
  <rect x="40" y="370" width="75" height="90" fill="#f8f9fa" rx="12"/>
  <circle cx="77" cy="405" r="20" fill="#3949ab"/>
  <text x="77" y="411" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  <text x="77" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e" text-anchor="middle">Send</text>
  
  <rect x="130" y="370" width="75" height="90" fill="#f8f9fa" rx="12"/>
  <circle cx="167" cy="405" r="20" fill="#4caf50"/>
  <text x="167" y="411" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <text x="167" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e" text-anchor="middle">Receive</text>
  
  <rect x="220" y="370" width="75" height="90" fill="#f8f9fa" rx="12"/>
  <circle cx="257" cy="405" r="20" fill="#ff9800"/>
  <text x="257" y="411" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">*</text>
  <text x="257" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e" text-anchor="middle">Rewards</text>
  
  <rect x="310" y="370" width="75" height="90" fill="#f8f9fa" rx="12"/>
  <circle cx="347" cy="405" r="20" fill="#9c27b0"/>
  <text x="347" y="411" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">M</text>
  <text x="347" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e" text-anchor="middle">More</text>
  
  <!-- Recent Transactions -->
  <text x="40" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e">Recent Transactions</text>
  
  <!-- Transaction 1 -->
  <rect x="40" y="520" width="320" height="60" fill="#f8f9fa" rx="8"/>
  <circle cx="70" cy="550" r="20" fill="#4caf50"/>
  <text x="70" y="556" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <text x="100" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a237e">Salary Credit</text>
  <text x="100" y="555" font-family="Arial, sans-serif" font-size="11" fill="#666">Today - 9:00 AM</text>
  <text x="340" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4caf50" text-anchor="end">+$5,000</text>
  
  <!-- Transaction 2 -->
  <rect x="40" y="590" width="320" height="60" fill="#ffffff" rx="8"/>
  <circle cx="70" cy="620" r="20" fill="#3949ab"/>
  <text x="70" y="626" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
  <text x="100" y="605" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a237e">Stock Purchase</text>
  <text x="100" y="625" font-family="Arial, sans-serif" font-size="11" fill="#666">Yesterday - 2:30 PM</text>
  <text x="340" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f44336" text-anchor="end">-$1,200</text>
  
  <!-- Bottom Navigation -->
  <rect x="20" y="630" width="360" height="30" fill="#f8f9fa"/>
  <circle cx="100" cy="645" r="8" fill="#3949ab"/>
  <circle cx="200" cy="645" r="8" fill="#ccc"/>
  <circle cx="300" cy="645" r="8" fill="#ccc"/>
</svg>

