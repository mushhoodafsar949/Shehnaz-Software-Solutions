<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#f8f9fa" rx="20"/>
  
  <!-- Title -->
  <text x="50" y="50" fill="#1e293b" font-family="Arial" font-size="24" font-weight="bold">FinTech Suite - Agile Development Process</text>
  
  <!-- Sprint Planning -->
  <g transform="translate(50, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Sprint Planning</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Risk Assessment -->
      <rect width="200" height="60" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Risk Assessment</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Security & Compliance</text>
      
      <!-- Feature Prioritization -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Feature Prioritization</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Market Impact Analysis</text>
      </g>
      
      <!-- Capacity Planning -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Capacity Planning</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Trading Volume Analysis</text>
      </g>
    </g>
  </g>
  
  <!-- Daily Process -->
  <g transform="translate(350, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Daily Process</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Market Analysis -->
      <rect width="200" height="60" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Market Analysis</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Trading Patterns</text>
      
      <!-- Security Review -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Security Review</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Threat Assessment</text>
      </g>
      
      <!-- Performance Check -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Performance Check</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">System Metrics</text>
      </g>
    </g>
  </g>
  
  <!-- Development -->
  <g transform="translate(650, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Development</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Smart Contracts -->
      <rect width="200" height="60" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Smart Contracts</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Solidity Development</text>
      
      <!-- Trading Engine -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Trading Engine</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Order Matching</text>
      </g>
      
      <!-- Analytics -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Analytics</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">ML Models</text>
      </g>
    </g>
  </g>
  
  <!-- Review -->
  <g transform="translate(950, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Review</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Security Audit -->
      <rect width="200" height="60" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Security Audit</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Penetration Testing</text>
      
      <!-- Performance Review -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Performance Review</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Load Testing</text>
      </g>
      
      <!-- Compliance Check -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Compliance Check</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Regulatory Review</text>
      </g>
    </g>
  </g>
  
  <!-- Retrospective -->
  <g transform="translate(50, 450)">
    <rect width="1150" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="575" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Sprint Retrospective</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Trading Performance -->
      <rect width="250" height="200" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
      <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle">Trading Performance</text>
      <g transform="translate(20, 60)">
        <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">• Order Execution Time</text>
        <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">• Transaction Success Rate</text>
        <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">• System Uptime</text>
      </g>
      
      <!-- Security Metrics -->
      <g transform="translate(300, 0)">
        <rect width="250" height="200" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle">Security Metrics</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">• Attack Prevention</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">• Vulnerability Fixes</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">• Audit Results</text>
        </g>
      </g>
      
      <!-- User Feedback -->
      <g transform="translate(600, 0)">
        <rect width="250" height="200" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle">User Feedback</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">• Trading Experience</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">• Feature Requests</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">• UI/UX Feedback</text>
        </g>
      </g>
      
      <!-- Next Steps -->
      <g transform="translate(900, 0)">
        <rect width="250" height="200" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle">Next Steps</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">• Performance Optimization</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">• New Trading Features</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">• Security Enhancements</text>
        </g>
      </g>
    </g>
  </g>
</svg>
