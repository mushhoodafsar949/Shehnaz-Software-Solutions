<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="devGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ffffff"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="900" fill="#1a237e" rx="20"/>
  
  <!-- Title -->
  <text x="600" y="40" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">FinTech Suite - DevOps Pipeline</text>
  
  <!-- Development Stage -->
  <g transform="translate(50, 100)">
    <rect width="220" height="700" fill="rgba(255,255,255,0.1)" rx="12" stroke="#ffffff" stroke-width="2"/>
    <text x="110" y="35" fill="#ffffff" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Development</text>
    
    <!-- GitLab -->
    <g transform="translate(20, 60)">
      <rect width="180" height="100" fill="url(#devGrad1)" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="90" cy="35" r="20" fill="rgba(255,255,255,0.3)"/>
      <text x="90" y="42" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">🔷</text>
      <text x="90" y="75" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">GitLab Enterprise</text>
      <text x="90" y="95" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Protected Branches</text>
    </g>
    
    <!-- IDE -->
