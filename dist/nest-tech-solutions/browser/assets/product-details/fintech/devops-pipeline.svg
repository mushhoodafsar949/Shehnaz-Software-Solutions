  <!-- Flow Arrows -->
  <g stroke="#ffffff" stroke-width="4" fill="none" marker-end="url(#arrowhead)" opacity="0.8">
    <!-- Dev to Test -->
    <path d="M270 450 L320 450"/>
    
    <!-- Test to Deploy -->
    <path d="M540 450 L590 450"/>
    
    <!-- Deploy to Monitor -->
    <path d="M810 450 L860 450"/>
  </g>
  
  <!-- Return Flow (Feedback loops) -->
  <g stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.5" stroke-dasharray="5,5">
    <!-- Monitor to Dev (Feedback) -->
    <path d="M970 500 Q1100 500 1100 200 Q1100 100 270 100 L270 400"/>
    
    <!-- Test to Dev (Bug fixes) -->
    <path d="M320 500 Q200 500 200 200 Q200 100 270 100 L270 400"/>
  </g>
  
  <!-- Stage Labels with Icons -->
  <g transform="translate(50, 850)">
    <rect width="220" height="30" fill="rgba(37,99,235,0.3)" rx="6" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="22" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Code Development &amp; Quality</text>
  </g>
  
  <g transform="translate(320, 850)">
    <rect width="220" height="30" fill="rgba(16,185,129,0.3)" rx="6" stroke="#10b981" stroke-width="2"/>
    <text x="110" y="22" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Automated Testing Suite</text>
  </g>
  
  <g transform="translate(590, 850)">
