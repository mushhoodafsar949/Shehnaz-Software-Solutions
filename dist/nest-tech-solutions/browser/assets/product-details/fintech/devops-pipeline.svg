<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#f8f9fa" rx="20"/>
  
  <!-- Title -->
  <text x="50" y="50" fill="#1e293b" font-family="Arial" font-size="24" font-weight="bold">FinTech Suite - DevOps Pipeline</text>
  
  <!-- Development Stage -->
  <g transform="translate(50, 100)">
    <rect width="250" height="600" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Development</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Version Control -->
      <rect width="200" height="80" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
      <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">GitLab Enterprise</text>
      <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Protected Branches</text>
      
      <!-- IDE -->
      <g transform="translate(0, 100)">
        <rect width="200" height="80" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">WebStorm + Plugins</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Smart Contracts IDE</text>
      </g>
      
      <!-- Code Quality -->
      <g transform="translate(0, 200)">
        <rect width="200" height="80" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Code Analysis</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">SonarQube + ESLint</text>
      </g>
      
      <!-- Security Scan -->
      <g transform="translate(0, 300)">
        <rect width="200" height="80" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Security Scanning</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Snyk + OWASP</text>
      </g>
    </g>
  </g>
  
  <!-- Testing Stage -->
  <g transform="translate(350, 100)">
    <rect width="250" height="600" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Testing</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Unit Tests -->
      <rect width="200" height="80" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
      <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Unit Testing</text>
      <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Jest + Mocha</text>
      
      <!-- Integration Tests -->
      <g transform="translate(0, 100)">
        <rect width="200" height="80" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Integration Tests</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Blockchain Testing</text>
      </g>
      
      <!-- Performance Tests -->
      <g transform="translate(0, 200)">
        <rect width="200" height="80" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Performance Testing</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">K6 + JMeter</text>
      </g>
      
      <!-- Security Tests -->
      <g transform="translate(0, 300)">
        <rect width="200" height="80" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Security Testing</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Penetration Testing</text>
      </g>
    </g>
  </g>
  
  <!-- Deployment Stage -->
  <g transform="translate(650, 100)">
    <rect width="250" height="600" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Deployment</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Smart Contract Deploy -->
      <rect width="200" height="80" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
      <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Smart Contracts</text>
      <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Truffle + Hardhat</text>
      
      <!-- Cloud Deploy -->
      <g transform="translate(0, 100)">
        <rect width="200" height="80" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Cloud Deployment</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">AWS EKS</text>
      </g>
      
      <!-- Database Migration -->
      <g transform="translate(0, 200)">
        <rect width="200" height="80" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">DB Migration</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Liquibase</text>
      </g>
      
      <!-- Backup -->
      <g transform="translate(0, 300)">
        <rect width="200" height="80" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Backup & DR</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Multi-Region</text>
      </g>
    </g>
  </g>
  
  <!-- Monitoring Stage -->
  <g transform="translate(950, 100)">
    <rect width="250" height="600" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Monitoring</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- APM -->
      <rect width="200" height="80" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
      <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">APM</text>
      <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">New Relic</text>
      
      <!-- Logging -->
      <g transform="translate(0, 100)">
        <rect width="200" height="80" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Logging</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">ELK Stack</text>
      </g>
      
      <!-- Alerting -->
      <g transform="translate(0, 200)">
        <rect width="200" height="80" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Alerting</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">PagerDuty</text>
      </g>
      
      <!-- Analytics -->
      <g transform="translate(0, 300)">
        <rect width="200" height="80" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="100" y="35" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Analytics</text>
        <text x="100" y="55" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Grafana + Kibana</text>
      </g>
    </g>
  </g>
  
  <!-- Flow Arrows -->
  <g transform="translate(0, 0)" stroke="#64748b" stroke-width="2" fill="none">
    <!-- Dev to Test -->
    <path d="M300 400 L350 400"/>
    <polygon points="345,395 355,400 345,405" fill="#64748b"/>
    
    <!-- Test to Deploy -->
    <path d="M600 400 L650 400"/>
    <polygon points="645,395 655,400 645,405" fill="#64748b"/>
    
    <!-- Deploy to Monitor -->
    <path d="M900 400 L950 400"/>
    <polygon points="945,395 955,400 945,405" fill="#64748b"/>
  </g>
</svg>
