      <circle cx="90" cy="35" r="20" fill="rgba(255,255,255,0.3)"/>
      <text x="90" y="42" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">❤️</text>
      <text x="90" y="75" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Health Checks</text>
