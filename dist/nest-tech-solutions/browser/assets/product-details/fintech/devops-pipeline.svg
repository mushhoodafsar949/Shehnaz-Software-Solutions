      <circle cx="90" cy="35" r="20" fill="rgba(255,255,255,0.3)"/>
      <text x="90" y="42" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">🔗</text>
      <text x="90" y="75" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Integration Tests</text>
      <text x="90" y="95" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">API Testing</text>
