      <text x="90" y="42" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">💻</text>
      <text x="90" y="75" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">VS Code + WebStorm</text>
      <text x="90" y="95" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Angular &amp; Flutter</text>
    </g>
    
    <!-- Code Quality -->
    <g transform="translate(20, 300)">
