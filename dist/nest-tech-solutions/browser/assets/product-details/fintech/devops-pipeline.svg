      <text x="90" y="42" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">🧪</text>
      <text x="90" y="75" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Unit Testing</text>
