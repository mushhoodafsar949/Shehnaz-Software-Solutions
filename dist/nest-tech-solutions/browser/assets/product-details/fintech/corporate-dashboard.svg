<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3949ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3949ab;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff" rx="8"/>
  
  <!-- Header -->
  <rect width="600" height="45" fill="#1a237e" rx="8 8 0 0"/>
  <text x="300" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Corporate Financial Dashboard</text>
  
  <!-- Stats Cards -->
  <rect x="20" y="60" width="130" height="75" fill="#f8f9fa" rx="6" stroke="#e0e0e0" stroke-width="1"/>
  <text x="85" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a237e" text-anchor="middle">Total Portfolio</text>
  <text x="85" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3949ab" text-anchor="middle">$2.4M</text>
  <text x="85" y="125" font-family="Arial, sans-serif" font-size="9" fill="#4caf50">+12.5%</text>
  
  <rect x="165" y="60" width="130" height="75" fill="#f8f9fa" rx="6" stroke="#e0e0e0" stroke-width="1"/>
  <text x="230" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a237e" text-anchor="middle">Bulk Transactions</text>
  <text x="230" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3949ab" text-anchor="middle">1,247</text>
  <text x="230" y="125" font-family="Arial, sans-serif" font-size="9" fill="#666">Today</text>
  
  <rect x="310" y="60" width="130" height="75" fill="#f8f9fa" rx="6" stroke="#e0e0e0" stroke-width="1"/>
  <text x="375" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a237e" text-anchor="middle">Gains/Losses</text>
  <text x="375" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4caf50" text-anchor="middle">+$45K</text>
  <text x="375" y="125" font-family="Arial, sans-serif" font-size="9" fill="#666">Net profit</text>
  
  <rect x="455" y="60" width="125" height="75" fill="#f8f9fa" rx="6" stroke="#e0e0e0" stroke-width="1"/>
  <text x="517" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a237e" text-anchor="middle">Integrations</text>
  <text x="517" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3949ab" text-anchor="middle">12</text>
  <text x="517" y="125" font-family="Arial, sans-serif" font-size="9" fill="#666">Active APIs</text>
  
  <!-- Chart Section -->
  <rect x="20" y="155" width="360" height="200" fill="#ffffff" rx="6" stroke="#e0e0e0" stroke-width="1"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a237e" text-anchor="middle">Portfolio Performance</text>
  
  <!-- Chart Line -->
  <polyline points="40,320 100,300 160,280 220,260 280,240 340,220" 
            fill="none" stroke="#3949ab" stroke-width="2" stroke-linecap="round"/>
  <polyline points="40,320 100,305 160,290 220,275 280,265 340,255" 
            fill="none" stroke="#4caf50" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Chart Area Fill -->
  <polygon points="40,320 100,300 160,280 220,260 280,240 340,220 340,320 40,320" 
           fill="url(#gradient1)" opacity="0.3"/>
  
  <!-- Bulk Processing Table -->
  <rect x="400" y="155" width="180" height="200" fill="#ffffff" rx="6" stroke="#e0e0e0" stroke-width="1"/>
  <text x="490" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e" text-anchor="middle">Recent Operations</text>
  
  <!-- Table Rows -->
  <rect x="410" y="195" width="160" height="30" fill="#f8f9fa" rx="3"/>
  <text x="420" y="212" font-family="Arial, sans-serif" font-size="10" fill="#333">Payroll Processing</text>
  <text x="560" y="212" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4caf50" text-anchor="end">$125K</text>
  
  <rect x="410" y="235" width="160" height="30" fill="#ffffff" rx="3"/>
  <text x="420" y="252" font-family="Arial, sans-serif" font-size="10" fill="#333">Investment Batch</text>
  <text x="560" y="252" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3949ab" text-anchor="end">247 txns</text>
  
  <rect x="410" y="275" width="160" height="30" fill="#f8f9fa" rx="3"/>
  <text x="420" y="292" font-family="Arial, sans-serif" font-size="10" fill="#333">Vendor Payments</text>
  <text x="560" y="292" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ff9800" text-anchor="end">$89K</text>
  
  <rect x="410" y="315" width="160" height="30" fill="#ffffff" rx="3"/>
  <text x="420" y="332" font-family="Arial, sans-serif" font-size="10" fill="#333">Dividend Distribution</text>
  <text x="560" y="332" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4caf50" text-anchor="end">$12K</text>
  
  <!-- Integration Icons -->
  <circle cx="460" cy="365" r="12" fill="#e3f2fd"/>
  <text x="460" y="370" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a237e" text-anchor="middle">API</text>
  
  <circle cx="490" cy="365" r="12" fill="#e8f5e9"/>
  <text x="490" y="370" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2e7d32" text-anchor="middle">✓</text>
  
  <circle cx="520" cy="365" r="12" fill="#fff3e0"/>
  <text x="520" y="370" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#e65100" text-anchor="middle">⚡</text>
</svg>
