<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="gradientWeb3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3949ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="900" height="600" fill="#ffffff" rx="12"/>
  
  <!-- Header -->
  <rect width="900" height="70" fill="#1a237e" rx="12 12 0 0"/>
  <text x="450" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Gains &amp; Losses Analysis</text>
  
  <!-- Summary Cards -->
  <rect x="30" y="100" width="260" height="130" fill="#e8f5e9" rx="8" stroke="#4caf50" stroke-width="2"/>
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e" text-anchor="middle">Total Gains</text>
  <text x="160" y="170" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#4caf50" text-anchor="middle">+$245K</text>
  <text x="160" y="195" font-family="Arial, sans-serif" font-size="13" fill="#666">This quarter</text>
  <text x="160" y="215" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">+18.7% increase</text>
  
  <rect x="310" y="100" width="260" height="130" fill="#ffebee" rx="8" stroke="#f44336" stroke-width="2"/>
  <text x="440" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e" text-anchor="middle">Total Losses</text>
  <text x="440" y="170" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#f44336" text-anchor="middle">-$32K</text>
  <text x="440" y="195" font-family="Arial, sans-serif" font-size="13" fill="#666">This quarter</text>
  <text x="440" y="215" font-family="Arial, sans-serif" font-size="12" fill="#f44336">-2.1% decrease</text>
  
  <rect x="590" y="100" width="280" height="130" fill="#e3f2fd" rx="8" stroke="#3949ab" stroke-width="2"/>
  <text x="730" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e" text-anchor="middle">Net Profit</text>
  <text x="730" y="170" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#3949ab" text-anchor="middle">+$213K</text>
  <text x="730" y="195" font-family="Arial, sans-serif" font-size="13" fill="#666">Net position</text>
  <text x="730" y="215" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">+16.6% ROI</text>
  
  <!-- Gains Chart -->
  <rect x="30" y="260" width="420" height="300" fill="#ffffff" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="240" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a237e" text-anchor="middle">Gains Breakdown by Sector</text>
  
  <!-- Bar Chart -->
  <rect x="60" y="320" width="60" height="200" fill="#4caf50" rx="4"/>
  <text x="90" y="540" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Tech</text>
  <text x="90" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50" text-anchor="middle">$95K</text>
  
  <rect x="140" y="360" width="60" height="160" fill="#3949ab" rx="4"/>
  <text x="170" y="540" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Finance</text>
  <text x="170" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3949ab" text-anchor="middle">$72K</text>
  
  <rect x="220" y="380" width="60" height="140" fill="#4caf50" rx="4"/>
  <text x="250" y="540" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Healthcare</text>
  <text x="250" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50" text-anchor="middle">$58K</text>
  
  <rect x="300" y="400" width="60" height="120" fill="#ff9800" rx="4"/>
  <text x="330" y="540" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Energy</text>
  <text x="330" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800" text-anchor="middle">$20K</text>
  
  <rect x="380" y="420" width="60" height="100" fill="#9c27b0" rx="4"/>
  <text x="410" y="540" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Others</text>
  <text x="410" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0" text-anchor="middle">$12K</text>
  
  <!-- Losses Chart -->
  <rect x="470" y="260" width="400" height="300" fill="#ffffff" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a237e" text-anchor="middle">Losses by Category</text>
  
  <!-- Loss Bars -->
  <rect x="500" y="480" width="80" height="60" fill="#f44336" rx="4"/>
  <text x="540" y="560" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Market</text>
  <text x="540" y="470" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f44336" text-anchor="middle">-$18K</text>
  
  <rect x="600" y="500" width="80" height="40" fill="#ff9800" rx="4"/>
  <text x="640" y="560" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Currency</text>
  <text x="640" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800" text-anchor="middle">-$8K</text>
  
  <rect x="700" y="510" width="80" height="30" fill="#9e9e9e" rx="4"/>
  <text x="740" y="560" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Fees</text>
  <text x="740" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9e9e9e" text-anchor="middle">-$6K</text>
  
  <rect x="800" y="520" width="60" height="20" fill="#e0e0e0" rx="4"/>
  <text x="830" y="560" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Other</text>
  <text x="830" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666" text-anchor="middle">-$2K</text>
  
  <!-- Performance Indicator -->
  <rect x="500" y="320" width="360" height="120" fill="#f8f9fa" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="680" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a237e" text-anchor="middle">Performance Indicator</text>
  
  <!-- Progress Bar -->
  <rect x="520" y="380" width="320" height="30" fill="#e0e0e0" rx="15"/>
  <rect x="520" y="380" width="280" height="30" fill="#4caf50" rx="15"/>
  <text x="680" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a237e" text-anchor="middle">87.5% Positive Performance</text>
  
  <text x="520" y="430" font-family="Arial, sans-serif" font-size="12" fill="#666">Gains Ratio: 7.6:1</text>
  <text x="750" y="430" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">Win Rate: 88%</text>
</svg>

