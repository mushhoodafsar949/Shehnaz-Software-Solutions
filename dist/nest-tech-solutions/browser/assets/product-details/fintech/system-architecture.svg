      <circle cx="90" cy="40" r="25" fill="rgba(255,255,255,0.3)"/>
      <text x="90" y="47" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">$</text>
      <text x="90" y="85" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Payment API</text>
      <text x="90" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">IBFT Transfers</text>
      <text x="90" y="130" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">International</text>
      <text x="90" y="150" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Account Upgrades</text>
      <text x="90" y="170" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Advance Salary</text>
    </g>
    
    <!-- Trading API -->
    <g transform="translate(240, 60)">
      <rect width="180" height="200" fill="url(#apiGrad)" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="90" cy="40" r="25" fill="rgba(255,255,255,0.3)"/>
      <text x="90" y="47" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">📈</text>
      <text x="90" y="85" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Trading API</text>
      <text x="90" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Stocks Trading</text>
      <text x="90" y="130" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Mutual Funds</text>
      <text x="90" y="150" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Portfolio Mgmt</text>
      <text x="90" y="170" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Real-time Data</text>
    </g>
    
    <!-- Portfolio API -->
    <g transform="translate(450, 60)">
      <rect width="180" height="200" fill="url(#apiGrad)" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="90" cy="40" r="25" fill="rgba(255,255,255,0.3)"/>
      <text x="90" y="47" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">📊</text>
      <text x="90" y="85" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Portfolio API</text>
      <text x="90" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Gains/Losses</text>
      <text x="90" y="130" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Analytics</text>
      <text x="90" y="150" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Bulk Processing</text>
      <text x="90" y="170" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Reports</text>
    </g>
    
    <!-- Rewards API -->
    <g transform="translate(660, 60)">
      <rect width="180" height="200" fill="url(#apiGrad)" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="90" cy="40" r="25" fill="rgba(255,255,255,0.3)"/>
      <text x="90" y="47" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">🎁</text>
      <text x="90" y="85" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Rewards API</text>
      <text x="90" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Referrals</text>
      <text x="90" y="130" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Spin &amp; Win</text>
      <text x="90" y="150" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Loyalty Points</text>
      <text x="90" y="170" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Redemptions</text>
    </g>
    
    <!-- Integration API -->
    <g transform="translate(870, 60)">
      <rect width="180" height="200" fill="url(#apiGrad)" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="90" cy="40" r="25" fill="rgba(255,255,255,0.3)"/>
      <text x="90" y="47" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">🔗</text>
      <text x="90" y="85" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Integration API</text>
      <text x="90" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Banking APIs</text>
      <text x="90" y="130" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Payment Gateways</text>
      <text x="90" y="150" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Trading Platforms</text>
      <text x="90" y="170" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Third-party</text>
    </g>
  </g>
  
  <!-- Database Layer -->
  <g transform="translate(50, 640)">
    <rect width="500" height="200" fill="rgba(255,255,255,0.1)" rx="12" stroke="#ffffff" stroke-width="2"/>
    <text x="250" y="30" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Database Layer</text>
    
    <!-- PostgreSQL -->
    <g transform="translate(30, 60)">
      <rect width="140" height="120" fill="url(#dbGrad)" rx="8" stroke="#ffffff" stroke-width="2"/>
      <rect x="20" y="15" width="100" height="50" fill="rgba(255,255,255,0.2)" rx="4"/>
      <text x="70" y="38" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL</text>
      <text x="70" y="55" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">Primary DB</text>
      <text x="70" y="85" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">User Data</text>
      <text x="70" y="105" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Transactions</text>
      <text x="70" y="120" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Portfolio</text>
    </g>
    
    <!-- Redis Cache -->
    <g transform="translate(190, 60)">
      <rect width="140" height="120" fill="url(#dbGrad)" rx="8" stroke="#ffffff" stroke-width="2"/>
      <rect x="20" y="15" width="100" height="50" fill="rgba(255,255,255,0.2)" rx="4"/>
      <text x="70" y="38" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Redis</text>
      <text x="70" y="55" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">Cache</text>
      <text x="70" y="85" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Session Data</text>
      <text x="70" y="105" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Real-time</text>
      <text x="70" y="120" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Queue</text>
    </g>
    
    <!-- File Storage -->
    <g transform="translate(350, 60)">
      <rect width="140" height="120" fill="url(#dbGrad)" rx="8" stroke="#ffffff" stroke-width="2"/>
      <rect x="20" y="15" width="100" height="50" fill="rgba(255,255,255,0.2)" rx="4"/>
      <text x="70" y="38" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">S3 Storage</text>
      <text x="70" y="55" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">AWS S3</text>
      <text x="70" y="85" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Documents</text>
      <text x="70" y="105" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Reports</text>
      <text x="70" y="120" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Backups</text>
    </g>
  </g>
  
  <!-- Third-Party Integrations -->
  <g transform="translate(600, 640)">
    <rect width="550" height="200" fill="rgba(255,255,255,0.1)" rx="12" stroke="#ffffff" stroke-width="2"/>
    <text x="275" y="30" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Third-Party Integrations</text>
    
    <!-- Banking APIs -->
    <g transform="translate(30, 60)">
      <rect width="120" height="120" fill="#10b981" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="60" cy="35" r="20" fill="rgba(255,255,255,0.3)"/>
      <text x="60" y="42" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">🏦</text>
      <text x="60" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Banking APIs</text>
      <text x="60" y="95" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Chase</text>
      <text x="60" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Wells Fargo</text>
    </g>
    
    <!-- Payment Gateways -->
    <g transform="translate(170, 60)">
      <rect width="120" height="120" fill="#10b981" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="60" cy="35" r="20" fill="rgba(255,255,255,0.3)"/>
      <text x="60" y="42" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">💳</text>
      <text x="60" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Payment</text>
      <text x="60" y="90" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Gateways</text>
      <text x="60" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Stripe</text>
    </g>
    
    <!-- Trading Platforms -->
    <g transform="translate(310, 60)">
      <rect width="120" height="120" fill="#10b981" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="60" cy="35" r="20" fill="rgba(255,255,255,0.3)"/>
      <text x="60" y="42" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">📈</text>
      <text x="60" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Trading</text>
      <text x="60" y="90" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Platforms</text>
      <text x="60" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Bloomberg</text>
    </g>
    
    <!-- Analytics -->
    <g transform="translate(450, 60)">
      <rect width="120" height="120" fill="#10b981" rx="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="60" cy="35" r="20" fill="rgba(255,255,255,0.3)"/>
      <text x="60" y="42" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">📊</text>
      <text x="60" y="75" fill="#ffffff" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Analytics</text>
      <text x="60" y="95" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Google</text>
      <text x="60" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="9" text-anchor="middle">Analytics</text>
    </g>
  </g>
  
  <!-- Flow Arrows -->
  <g stroke="#ffffff" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.7">
    <!-- Frontend to API Gateway -->
    <path d="M250 220 L500 220"/>
    <path d="M450 220 L500 220"/>
    
    <!-- API Gateway to Business Logic -->
    <path d="M700 220 L750 220"/>
    
    <!-- Business Logic to APIs -->
    <path d="M850 220 L850 280 L140 280"/>
    <path d="M850 220 L850 280 L350 280"/>
    <path d="M850 220 L850 280 L560 280"/>
    <path d="M850 220 L850 280 L770 280"/>
    <path d="M850 220 L850 280 L980 280"/>
    
    <!-- APIs to Database -->
    <path d="M140 480 L140 640 L120 640"/>
    <path d="M350 480 L350 640 L200 640"/>
    <path d="M560 480 L560 640 L280 640"/>
    
    <!-- APIs to Integrations -->
    <path d="M770 480 L770 640 L630 640"/>
    <path d="M980 480 L980 640 L800 640"/>
    
    <!-- Business Logic to Integrations -->
    <path d="M850 220 L850 640 L700 640"/>
  </g>
  
  <!-- Return Flow Arrows (lighter) -->
  <g stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.4" stroke-dasharray="5,5">
    <!-- Database to APIs -->
    <path d="M200 760 L200 480 L140 480"/>
    <path d="M280 760 L280 480 L350 480"/>
    
    <!-- Integrations to APIs -->
    <path d="M700 760 L700 480 L770 480"/>
    <path d="M800 760 L800 480 L980 480"/>
  </g>
</svg>
