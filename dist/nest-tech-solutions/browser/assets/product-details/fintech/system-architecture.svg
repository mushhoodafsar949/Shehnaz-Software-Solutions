<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="900" fill="#1a237e" rx="20"/>
  
  <!-- Title -->
  <text x="600" y="40" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">FinTech Suite - Technical Architecture</text>
  
  <!-- Frontend Layer -->
  <g transform="translate(50, 80)">
    <!-- Angular Web Portal -->
    <rect width="200" height="140" fill="url(#frontendGrad)" rx="12" stroke="#ffffff" stroke-width="2"/>
    <rect x="10" y="10" width="180" height="50" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="100" y="35" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Angular</text>
    <text x="100" y="50" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">Web Portal</text>
    <text x="100" y="85" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="600">Corporate Dashboard</text>
    <text x="100" y="105" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Bulk Processing</text>
    <text x="100" y="120" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Portfolio Analytics</text>
    
    <!-- Flutter Mobile App -->
    <g transform="translate(250, 0)">
      <rect width="200" height="140" fill="url(#frontendGrad)" rx="12" stroke="#ffffff" stroke-width="2"/>
      <rect x="10" y="10" width="180" height="50" fill="rgba(255,255,255,0.2)" rx="6"/>
      <text x="100" y="35" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Flutter</text>
      <text x="100" y="50" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">Mobile App</text>
      <text x="100" y="85" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="600">iOS &amp; Android</text>
      <text x="100" y="105" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Stocks &amp; Funds</text>
      <text x="100" y="120" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">Payments &amp; Rewards</text>
    </g>
  </g>
  
  <!-- API Gateway / Load Balancer -->
  <g transform="translate(500, 80)">
    <rect width="200" height="140" fill="#f59e0b" rx="12" stroke="#ffffff" stroke-width="2"/>
    <text x="100" y="40" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">API Gateway</text>
    <text x="100" y="60" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="11" text-anchor="middle">Load Balancer</text>
    <rect x="20" y="75" width="160" height="8" fill="rgba(255,255,255,0.3)" rx="4"/>
    <rect x="20" y="90" width="160" height="8" fill="rgba(255,255,255,0.3)" rx="4"/>
    <rect x="20" y="105" width="160" height="8" fill="rgba(255,255,255,0.3)" rx="4"/>
    <text x="100" y="125" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">SSL Termination</text>
  </g>
  
  <!-- Business Logic Layer -->
  <g transform="translate(750, 80)">
    <rect width="200" height="140" fill="url(#backendGrad)" rx="12" stroke="#ffffff" stroke-width="2"/>
    <text x="100" y="40" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Business Logic</text>
    <text x="100" y="60" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="11" text-anchor="middle">Node.js &amp; Python</text>
    <text x="100" y="85" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">- Request Processing</text>
    <text x="100" y="105" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">- Data Validation</text>
    <text x="100" y="120" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="10" text-anchor="middle">- Business Rules</text>
  </g>
  
  <!-- API Services Layer -->
