        <rect width="250" height="200" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle">Technical Performance</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">• System Response Time</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">• IoT Device Health</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">• Data Accuracy</text>
        </g>
      </g>
      
      <!-- Customer Experience -->
      <g transform="translate(600, 0)">
        <rect width="250" height="200" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle">Customer Experience</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">• Checkout Speed</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">• Service Quality</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">• Store Layout</text>
