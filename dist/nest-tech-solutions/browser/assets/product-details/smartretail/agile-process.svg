<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#f8f9fa" rx="20"/>
  
  <!-- Title -->
  <text x="50" y="50" fill="#1e293b" font-family="Arial" font-size="24" font-weight="bold">SmartRetail Pro - Agile Development Process</text>
  
  <!-- Sprint Planning -->
  <g transform="translate(50, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Sprint Planning</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Store Analysis -->
      <rect width="200" height="60" fill="#FF5722" opacity="0.1" stroke="#FF5722" stroke-width="2" rx="5"/>
      <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Store Analysis</text>
      <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Peak Hours & Traffic</text>
      
      <!-- Inventory Planning -->
      <g transform="translate(0, 80)">
        <rect width="200" height="60" fill="#FF5722" opacity="0.1" stroke="#FF5722" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Inventory Planning</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Stock Optimization</text>
      </g>
      
      <!-- Resource Allocation -->
      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="#FF5722" opacity="0.1" stroke="#FF5722" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Resource Allocation</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Staff Scheduling</text>
      </g>
    </g>
  </g>
  
  <!-- Daily Operations -->
  <g transform="translate(350, 100)">
    <rect width="250" height="300" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Daily Operations</text>
    
    <!-- Components -->
    <g transform="translate(25, 70)">
      <!-- Sales Monitoring -->
      <rect width="200" height="60" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2" rx="5"/>
