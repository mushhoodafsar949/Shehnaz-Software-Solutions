        <rect width="250" height="200" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2" rx="5"/>
        <text x="125" y="40" fill="#1e293b" font-family="Arial" font-size="16" text-anchor="middle">Action Items</text>
        <g transform="translate(20, 60)">
          <text x="0" y="20" fill="#64748b" font-family="Arial" font-size="14">• Process Improvements</text>
          <text x="0" y="50" fill="#64748b" font-family="Arial" font-size="14">• System Updates</text>
          <text x="0" y="80" fill="#64748b" font-family="Arial" font-size="14">• Training Needs</text>
