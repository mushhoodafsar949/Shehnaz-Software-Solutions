      <g transform="translate(0, 160)">
        <rect width="200" height="60" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2" rx="5"/>
        <text x="100" y="25" fill="#1e293b" font-family="Arial" font-size="14" text-anchor="middle">Analytics</text>
        <text x="100" y="45" fill="#64748b" font-family="Arial" font-size="12" text-anchor="middle">Business Intelligence</text>
      </g>
    </g>
